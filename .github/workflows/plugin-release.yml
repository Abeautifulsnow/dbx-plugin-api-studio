name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # The release packages the committed ui/index.html, so fail before packaging
  # when the artifact is stale relative to frontend/src (same gate as
  # ui-build-check.yml, which only covers pushes and PRs). The wire fixtures
  # and the Rust side of the contract are verified in the same job so a release
  # cannot go out with a drifted UI→Rust contract.
  verify-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: npm ci
      - run: npm run build:ui
      - run: git diff --exit-code ui/index.html
      - run: npm run test:ui
      # dbx-plugin-sdk is not on crates.io; point cargo at the SDK bundled in
      # the same CLI version the release job below packages with.
      - run: |
          npm install --no-save --no-package-lock @dbx-app/plugin-cli@0.1.9
          node tools/setup-sdk-patch.mjs
      - run: cargo test --manifest-path backend/Cargo.toml
      # cargo test produced the debug binary; run the stdio RPC smoke so a
      # release cannot go out with a sidecar whose protocol behavior regressed.
      - run: node tools/sidecar-smoke.mjs backend/target/debug/dbx-plugin-dbx-plugin-api-studio
      - run: git diff --exit-code backend/tests/fixtures/wire_specs.json

  release:
    needs: verify-ui
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-sdk-v1
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      # Keep in sync with the locally used CLI (npx dbx-plugin --version); a
      # mismatch means the release candidates were built against a different
      # SDK contract than the ones verified locally.
      plugin-cli-version: 0.1.9
