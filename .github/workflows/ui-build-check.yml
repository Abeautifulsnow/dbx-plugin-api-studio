name: UI build check

# `ui/index.html` is a build artifact committed so the packaged bundle is
# reproducible and reviewable. Nothing stopped a source-only change from being
# merged and released, which would ship the previous bundle — this job rebuilds
# and fails when the committed artifact drifts from `frontend/src`.
#
# The release workflow (`plugin-release.yml`) packages whatever is in the repo,
# so this check is the only thing keeping the artifact in sync.

on:
  push:
    paths:
      - "frontend/**"
      - "ui/index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tools/build-ui.mjs"
      - "tools/ui-*.mjs"
      - ".github/workflows/ui-build-check.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "ui/index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tools/build-ui.mjs"
      - "tools/ui-*.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install dependencies
        run: npm ci

      - name: Bundle the workbench into a single ui/index.html
        run: npm run build:ui

      - name: Fail when the committed artifact is stale
        run: |
          if ! git diff --exit-code -- ui/index.html; then
            echo "::error file=ui/index.html::ui/index.html does not match frontend/src — run 'npm run build:ui' and commit the result."
            exit 1
          fi

      - name: Type and accessibility check
        run: npm run check:ui

      - name: Test suites (library, state, redaction, class coverage, boot)
        run: npm run test:ui

      # The UI suites regenerate backend/tests/fixtures/wire_specs.json from
      # the real buildSendSpec; running cargo test right after — then diffing —
      # makes the UI → JSON → Rust wire contract a hard gate in one job. A
      # frontend contract change without regenerated fixtures fails here.
      #
      # dbx-plugin-sdk is not on crates.io; install the plugin CLI and point
      # cargo at the bundled SDK first (same CLI the release packages with).
      - name: Wire the DBX Rust SDK (ships with the plugin CLI)
        run: |
          npm install --no-save --no-package-lock @dbx-app/plugin-cli@0.1.9
          node tools/setup-sdk-patch.mjs

      - name: Verify the Rust side of the wire contract
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Fail when wire fixtures are stale
        run: |
          if ! git diff --exit-code -- backend/tests/fixtures/wire_specs.json; then
            echo "::error file=backend/tests/fixtures/wire_specs.json::wire_specs.json does not match buildSendSpec — run 'npm run test:ui' and commit the result."
            exit 1
          fi
