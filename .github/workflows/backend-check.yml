name: Backend check

# PR gate for backend-only changes. The UI workflow (ui-build-check.yml) runs
# cargo test for wire-contract changes, but a push that only touches Rust code
# would otherwise skip it; this job keeps `cargo test` + clippy + the stdio
# RPC smoke on every backend PR.

on:
  push:
    paths:
      - "backend/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "backend/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # dbx-plugin-sdk is not on crates.io; it ships inside the plugin CLI's
      # npm package. Install the same CLI the release packages with and point
      # cargo at the bundled SDK (tools/setup-sdk-patch.mjs writes
      # .cargo/config.toml, which cargo picks up from any working directory).
      - name: Wire the DBX Rust SDK (ships with the plugin CLI)
        run: |
          npm install --no-save --no-package-lock @dbx-app/plugin-cli@0.1.9
          node tools/setup-sdk-patch.mjs

      - name: Run backend tests (unit, protocol, wire contract)
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      # cargo test above already produced the debug binary; drive it over
      # stdio-jsonl exactly as the host does so parser/RPC regressions that
      # unit tests miss (e.g. a stale smoke assertion vs new semantics) fail
      # the PR instead of surfacing on main.
      - name: Sidecar protocol smoke (stdio-jsonl RPC)
        run: node tools/sidecar-smoke.mjs backend/target/debug/dbx-plugin-dbx-plugin-api-studio
