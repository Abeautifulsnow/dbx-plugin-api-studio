/* ==== js/20-variables.js ==== */

/* ==== Variable resolution, validation, request folding ==== */

const VAR_PATTERN = /\{\{\s*([A-Za-z0-9_.-]+)\s*\}\}/g;

/**
 * Resolve {{name}} references in one string.
 * - maskSecrets: secret references are kept as {{name}} (used for cURL export)
 *   instead of being copied into the output.
 */
function resolveString(text, scope, maskSecrets) {
  const unresolved = [];
  if (typeof text !== "string") return { value: "", unresolved };
  const value = text.replace(VAR_PATTERN, (whole, name) => {
    const entry = scope.get(name);
    if (!entry) {
      if (!unresolved.includes(name)) unresolved.push(name);
      return whole;
    }
    if (entry.secret) {
      if (maskSecrets) return "{{" + name + "}}";
      if (!entry.value) {
        if (!unresolved.includes(name)) unresolved.push(name);
        return whole;
      }
      return entry.value;
    }
    return entry.value;
  });
  return { value, unresolved };
}

/** JSONPath of a node inside the parsed response, e.g. $.store.books[2].title */
function jsonPathOf(path) {
  return "$" + path;
}

function btoaUtf8(text) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(text)));
}

const CONTENT_TYPES = {
  json: "application/json",
  text: "text/plain",
  urlencoded: "application/x-www-form-urlencoded",
};

/**
 * Fold the editor request into a sidecar request spec:
 * - resolve variables (maskSecrets=false),
 * - fold auth into headers/query,
 * - ensure a body content-type header.
 * Returns { spec, issues } where issues maps field -> { message, unresolved }.
 */
function buildSendSpec(request, requestId, scope, maskSecrets) {
  const issues = {};
  const collect = (field, resolved) => {
    if (resolved.unresolved.length) {
      issues[field] = { unresolved: resolved.unresolved };
      return true;
    }
    return false;
  };

  const urlRes = resolveString(request.url, scope, maskSecrets);
  const badUrl = collect("url", urlRes);

  const headerRows = (request.headers || []).filter((row) => row.enabled && row.key.trim());
  const headers = [];
  for (const row of headerRows) {
    const name = resolveString(row.key, scope, maskSecrets);
    const value = resolveString(row.value, scope, maskSecrets);
    if (collect("headers", name) || collect("headers", value)) continue;
    headers.push({ name: name.value, value: value.value });
  }

  const auth = request.auth || { type: "none" };
  const authHeader = (name, value) => {
    const idx = headers.findIndex((h) => h.name.toLowerCase() === name.toLowerCase());
    if (idx >= 0) headers.splice(idx, 1);
    headers.push({ name, value });
  };
  const authTypeResolved = auth.type;
  if (authTypeResolved === "bearer") {
    const token = resolveString(auth.token || "", scope, maskSecrets);
    if (!token.value && !collect("auth", token)) {
      issues.auth = { messageKey: null, empty: true, unresolved: [] };
    } else if (!collect("auth", token)) {
      authHeader("Authorization", "Bearer " + token.value);
    }
  } else if (authTypeResolved === "basic") {
    const user = resolveString(auth.username || "", scope, maskSecrets);
    const pass = resolveString(auth.password || "", scope, maskSecrets);
    if (!collect("auth", user) && !collect("auth", pass)) {
      authHeader("Authorization", "Basic " + btoaUtf8(user.value + ":" + pass.value));
    }
  } else if (authTypeResolved === "apikey") {
    const keyName = resolveString(auth.keyName || "", scope, maskSecrets);
    const keyValue = resolveString(auth.keyValue || "", scope, maskSecrets);
    if (!collect("auth", keyName) && !collect("auth", keyValue)) {
      if (auth.in === "query") {
        if (!badUrl) urlRes.value = appendQueryParam(urlRes.value, keyName.value, keyValue.value);
      } else {
        authHeader(keyName.value, keyValue.value);
      }
    }
  }

  let bodyText;
  const bodyType = (request.body && request.body.type) || "none";
  if (bodyType !== "none") {
    const raw = request.body.text || "";
    const resolvedBody = resolveString(raw, scope, maskSecrets);
    collect("body", resolvedBody);
    bodyText = resolvedBody.value;
    if (bodyType === "json" && bodyText.trim()) {
      try {
        JSON.parse(bodyText);
      } catch {
        issues.body = issues.body || { unresolved: [] };
        issues.body.json = true;
      }
    }
    const contentType = CONTENT_TYPES[bodyType] || CONTENT_TYPES.text;
    if (!headers.some((h) => h.name.toLowerCase() === "content-type")) {
      headers.push({ name: "Content-Type", value: contentType });
    }
  }

  if (!urlRes.value.trim() || badUrl || !isHttpUrl(urlRes.value)) {
    issues.url = issues.url || { unresolved: urlRes.unresolved };
    issues.url.invalid = true;
  }

  const settings = request.settings || {};
  const spec = {
    requestId,
    method: request.method,
    url: urlRes.value,
    headers,
    body: bodyText == null ? { type: "none" } : { type: "raw", text: bodyText },
    settings: {
      timeoutMs: clampInt(settings.timeoutMs, 1000, 300000, 30000),
      followRedirects: settings.followRedirects !== false,
      maxRedirects: clampInt(settings.maxRedirects, 0, 20, 10),
      verifyTls: settings.verifyTls !== false,
      maxBodyBytes: State.settings.previewCapBytes,
    },
  };
  return { spec, issues };
}

function isHttpUrl(text) {
  try {
    const parsed = new URL(text);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch {
    return false;
  }
}

function clampInt(value, min, max, fallback) {
  const num = Number.parseInt(value, 10);
  if (Number.isNaN(num)) return fallback;
  return Math.min(max, Math.max(min, num));
}

function appendQueryParam(urlText, key, value) {
  const separator = urlText.includes("?") ? "&" : "?";
  const hashIndex = urlText.indexOf("#");
  let base = urlText;
  let hash = "";
  if (hashIndex >= 0) {
    base = urlText.slice(0, hashIndex);
    hash = urlText.slice(hashIndex);
  }
  return base + separator + encodeURIComponent(key) + "=" + encodeURIComponent(value) + hash;
}

/** Query-string sync helpers. The enabled rows and the URL query stay in
 * agreement; manually authored values are re-imported rather than dropped. */
function parseUrlQuery(urlText) {
  const hashIndex = urlText.indexOf("#");
  const withoutHash = hashIndex >= 0 ? urlText.slice(0, hashIndex) : urlText;
  const qIndex = withoutHash.indexOf("?");
  if (qIndex < 0) return { pairs: [], base: withoutHash };
  const base = withoutHash.slice(0, qIndex);
  const query = withoutHash.slice(qIndex + 1);
  const pairs = [];
  for (const part of query.split("&")) {
    if (!part) continue;
    const eq = part.indexOf("=");
    const rawKey = eq < 0 ? part : part.slice(0, eq);
    const rawValue = eq < 0 ? "" : part.slice(eq + 1);
    pairs.push({ key: safeDecode(rawKey), value: safeDecode(rawValue) });
  }
  return { pairs, base };
}

function safeDecode(text) {
  try {
    return decodeURIComponent(text.replace(/\+/g, " "));
  } catch {
    return text;
  }
}

function rebuildUrlQuery(urlText, pairs) {
  const hashIndex = urlText.indexOf("#");
  const base = hashIndex >= 0 ? urlText.slice(0, hashIndex) : urlText;
  const hash = hashIndex >= 0 ? urlText.slice(hashIndex) : "";
  if (!pairs.length) return base + hash;
  const query = pairs
    .map((pair) => encodeURIComponent(pair.key) + "=" + encodeURIComponent(pair.value))
    .join("&");
  return base + "?" + query + hash;
}

function serializeQueryPairs(rows) {
  return rows.filter((row) => row.enabled).map((row) => ({ key: row.key, value: row.value }));
}


/* ==== js/25-jsonview.js ==== */

/* ==== JSON tree viewer (lazy children, context actions, search) ==== */

const JsonView = (() => {
  const MAX_RENDER_DEPTH = 200;
  const PREVIEW_STR = 160;
  const MAX_SET_VAR_BYTES = 64 * 1024;

  /** Parse the payload and produce a lightweight node tree. */
  function buildTree(text) {
    let value;
    try {
      value = JSON.parse(text);
    } catch {
      return null;
    }
    return { root: value };
  }

  function describe(value) {
    if (value === null) return { kind: "null", label: "null" };
    if (Array.isArray(value)) return { kind: "array", label: "[" + value.length + "]" };
    if (typeof value === "object") {
      return { kind: "object", label: "{" + Object.keys(value).length + "}" };
    }
    if (typeof value === "string") {
      const preview = value.length > PREVIEW_STR ? value.slice(0, PREVIEW_STR) + "…" : value;
      return { kind: "string", label: JSON.stringify(preview) };
    }
    return { kind: typeof value, label: String(value) };
  }

  function valueClass(kind) {
    if (kind === "string") return "jv-string";
    if (kind === "number") return "jv-number";
    if (kind === "null" || kind === "boolean") return "jv-literal";
    return "";
  }

  function containerEntries(value) {
    if (Array.isArray(value)) return value.map((v, i) => ({ key: String(i), path: "[" + i + "]", value: v }));
    return Object.keys(value).map((key) => ({
      key,
      path: /^[A-Za-z_$][\w$]*$/.test(key) ? "." + key : "[" + JSON.stringify(key) + "]",
      value: value[key],
    }));
  }

  function matches(nodePath, query) {
    if (!query) return true;
    return nodePath.toLowerCase().includes(query.toLowerCase());
  }

  /**
   * Render a JSON node as a DOM subtree. Children render lazily on expand so
   * wide payloads never stall the workbench (PRD NFR: 1 MB JSON < 300 ms).
   */
  function renderNode(key, path, value, depth, query, actions) {
    const info = describe(value);
    const rowPath = path;
    const isContainer = info.kind === "object" || info.kind === "array";
    const row = el("div", { class: "jv-row" + (actions ? " jv-row--clickable" : "") });

    const toggle = isContainer
      ? el("button", {
          class: "jv-toggle",
          "aria-expanded": "false",
          "aria-label": (key || "root") + " expand",
          title: "Expand",
        }, icon("chevron"))
      : el("span", { class: "jv-toggle" });

    row.append(toggle);
    if (key !== null && key !== undefined && path !== "$") {
      row.append(el("span", { class: "jv-key", text: JSON.stringify(key) }), el("span", { class: "jv-punct", text: ": " }));
    }

    if (!isContainer) {
      row.append(el("span", { class: valueClass(info.kind), text: info.label }));
    } else {
      row.append(
        el("span", { class: "jv-punct", text: info.kind === "array" ? "[" : "{" }),
        el("span", { class: "jv-summary", text: info.label }),
      );
    }

    const node = el("div", { class: "jv-node" });
    node.append(row);

    let childrenBox = null;
    let expanded = false;

    const renderChildren = () => {
      const entries = containerEntries(value);
      childrenBox = el("div", { class: "jv-children", role: "group" });
      if (!entries.length) {
        childrenBox.append(el("span", {
          class: "jv-summary",
          text: info.kind === "array" ? "[]" : "{}",
        }));
      }
      for (const entry of entries) {
        if (query && !matches(entry.key, query) && depth > MAX_RENDER_DEPTH) continue;
        childrenBox.append(renderNode(entry.key, rowPath + entry.path, entry.value, depth + 1, query, actions));
      }
    };

    const setExpanded = (expand) => {
      expanded = expand;
      toggle.setAttribute("aria-expanded", String(expand));
      if (expand) {
        if (!childrenBox) renderChildren();
        if (childrenBox.parentNode !== node) node.append(childrenBox);
      } else if (childrenBox && childrenBox.parentNode === node) {
        childrenBox.remove();
      }
    };

    if (isContainer) {
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        setExpanded(!expanded);
      });
      // Containers start collapsed except the root's direct children level.
      if (depth === 0) setExpanded(true);
    }

    if (actions) {
      row.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        actions(event, { key: key === undefined ? null : key, path: jsonPathOf(rowPath), value });
      });
      row.addEventListener("dblclick", (event) => {
        actions(event, { key: key === undefined ? null : key, path: jsonPathOf(rowPath), value });
      });
    }

    return node;
  }

  function render(container, text, options) {
    container.textContent = "";
    const tree = buildTree(text);
    if (!tree) return false;
    const actions = options && options.onNodeAction;
    container.append(renderNode(null, "$", tree.root, 0, (options && options.query) || "", actions));
    return true;
  }

  function canSetAsVariable(value, truncated) {
    if (truncated) return false;
    if (value == null) return true;
    if (typeof value === "object") {
      try { return JSON.stringify(value).length <= MAX_SET_VAR_BYTES; } catch { return false; }
    }
    return String(value).length <= MAX_SET_VAR_BYTES;
  }

  return { render, buildTree, canSetAsVariable };
})();


/* ==== js/30-kv.js ==== */

/* ==== Key-value row editor (Params / Headers / env variables) ==== */

/**
 * Render a KV table bound to `rows` (mutated in place; caller persists).
 * opts: { columns: {description?:bool, secretToggle?:bool}, addLabel,
 *         rowMenu, onchange, fieldName }
 */
function renderKvEditor(container, rows, opts) {
  container.textContent = "";
  const showDesc = !opts || !opts.columns || opts.columns.description !== false;

  const head = el("div", { class: "kv__head" },
    el("span", { text: "" }),
    el("span", { text: I18N.t("key") }),
    el("span", { text: I18N.t("value") }),
    showDesc ? el("span", { text: I18N.t("description") }) : el("span"),
    el("span", { text: "" }),
  );

  const table = el("div", { class: "kv" });
  table.append(head);

  const commit = () => {
    if (opts && opts.onchange) opts.onchange();
  };

  if (!rows.length) {
    const emptyText = opts && opts.emptyText ? opts.emptyText : I18N.t("addParam");
    table.append(el("div", { class: "kv__empty empty", text: "" },
      el("span", { text: emptyText }),
    ));
  }

  for (const row of rows) {
    table.append(renderKvRow(row, rows, { showDesc, commit, opts }));
  }

  const foot = el("div", { class: "kv__foot" },
    el("button", {
      class: "btn btn--sm btn--ghost",
      type: "button",
      onclick: () => {
        rows.push(newRow());
        commit();
        renderKvEditor(container, rows, opts);
      },
    }, icon("plus"), I18N.t(opts && opts.addLabel ? opts.addLabel : "addParam")),
  );
  table.append(foot);
  container.append(table);
}

function renderKvRow(row, rows, ctx) {
  const { showDesc, commit, opts } = ctx;
  const wrap = el("div", { class: "kv-row" + (row.enabled ? "" : " kv-row--disabled") });

  const enabledBox = el("input", { type: "checkbox", "aria-label": I18N.t("enabled") });
  enabledBox.checked = !!row.enabled;
  enabledBox.addEventListener("change", () => {
    row.enabled = enabledBox.checked;
    commit();
    rerender();
  });

  const keyInput = el("input", {
    class: "kv-input mono",
    type: "text",
    spellcheck: "false",
    "aria-label": I18N.t("key"),
    placeholder: "key",
  });
  keyInput.value = row.key;
  keyInput.addEventListener("input", () => { row.key = keyInput.value; commit(); });

  const secretToggle = opts && opts.columns && opts.columns.secretToggle;
  let valueInput;
  const valueWrap = el("div", { class: "secret-wrap" });
  const applyMask = () => {
    valueInput.type = row.secret && !row.reveal ? "password" : "text";
  };
  valueInput = el("input", {
    class: "kv-input mono",
    type: "text",
    spellcheck: "false",
    "aria-label": I18N.t("value"),
    placeholder: "value",
  });
  valueInput.value = row.value;
  applyMask();
  valueInput.addEventListener("input", () => { row.value = valueInput.value; commit(); });
  valueWrap.append(valueInput);

  if (secretToggle) {
    const revealBtn = el("button", {
      class: "icon-btn",
      type: "button",
      "aria-label": row.reveal ? "Hide value" : "Reveal value",
      title: row.reveal ? "Hide" : "Reveal",
      onclick: () => {
        row.reveal = !row.reveal;
        applyMask();
        revealBtn.replaceChildren(icon(row.reveal ? "eyeOff" : "eye"));
      },
    }, icon(row.reveal ? "eyeOff" : "eye"));
    valueWrap.append(revealBtn);
  }

  const descInput = showDesc
    ? el("input", {
        class: "kv-input",
        type: "text",
        "aria-label": I18N.t("description"),
        placeholder: I18N.t("description"),
      })
    : null;
  if (descInput) {
    descInput.value = row.description || "";
    descInput.addEventListener("input", () => { row.description = descInput.value; commit(); });
  }

  const menuBtn = el("button", {
    class: "icon-btn",
    type: "button",
    "aria-label": I18N.t("rowMenu"),
    title: I18N.t("rowMenu"),
    "aria-haspopup": "menu",
    onclick: (event) => openContextMenu(event.currentTarget, [
      {
        label: I18N.t("duplicateRow"),
        action: () => {
          const index = rows.indexOf(row);
          rows.splice(index + 1, 0, { ...deepClone(row), id: uuid("kv") });
          commit();
          rerender();
        },
      },
      { sep: true },
      {
        label: I18N.t("deleteRow"),
        danger: true,
        action: () => {
          const index = rows.indexOf(row);
          if (index >= 0) rows.splice(index, 1);
          commit();
          rerender();
        },
      },
    ]),
  }, icon("dots"));

  wrap.append(
    el("label", { class: "checkbox" }, enabledBox),
    keyInput,
    valueWrap,
    showDesc ? descInput : el("span"),
    el("div", { class: "kv-row__menu" }, menuBtn),
  );

  function rerender() {
    if (opts && opts.rerenderAll) {
      opts.rerenderAll();
    } else {
      const fresh = renderKvRow(row, rows, ctx);
      wrap.replaceWith(fresh);
    }
  }

  return wrap;
}


/* ==== js/35-dialogs.js ==== */

/* ==== Dialogs (plugin-styled; native alert/confirm/prompt are forbidden),
   context menu, and the environment manager ==== */

function closeTopOverlay() {
  const overlay = document.querySelector(".overlay");
  if (overlay) {
    overlay.remove();
    return true;
  }
  return false;
}

function openDialog(content, { wide, initialFocus } = {}) {
  const dialog = el("div", { class: "dialog" + (wide ? " dialog--wide" : ""), role: "dialog", "aria-modal": "true" });
  dialog.append(content);
  const overlay = el("div", {
    class: "overlay",
    onclick: (event) => { if (event.target === overlay) closeDialog(); },
  }, dialog);
  overlay.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.stopPropagation();
      closeDialog();
    }
  });
  document.body.append(overlay);
  function closeDialog() {
    overlay.remove();
  }
  const focusTarget = initialFocus || dialog.querySelector("input, select, textarea, button");
  if (focusTarget) focusTarget.focus();
  return { close: closeDialog, dialog };
}

function promptDialog({ title, label, value, okText, errorText }) {
  return new Promise((resolve) => {
    const input = el("input", { class: "input", type: "text", value: value || "", spellcheck: "false" });
    const error = el("div", { class: "dialog__error", text: errorText || "", hidden: true });
    let handle;
    const submit = () => {
      const text = input.value.trim();
      if (!text) {
        error.textContent = I18N.t("nameRequired");
        error.hidden = false;
        input.classList.add("input--error");
        return;
      }
      handle.close();
      resolve(text);
    };
    const form = el("form", {},
      el("h2", { class: "dialog__title", text: title }),
      el("div", { class: "dialog__field" },
        el("label", { text: label, for: "dialog-input" }),
        input,
        error,
      ),
      el("div", { class: "dialog__actions" },
        el("button", {
          class: "btn", type: "button", text: I18N.t("keepEditing"),
          onclick: () => { handle.close(); resolve(null); },
        }),
        el("button", { class: "btn btn--primary", type: "submit", text: okText || I18N.t("save") }),
      ),
    );
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submit();
    });
    handle = openDialog(form, { initialFocus: input });
  });
}

function confirmDialog({ title, message, okText, okClass, cancelText }) {
  return new Promise((resolve) => {
    let handle;
    const panel = el("div", {},
      el("h2", { class: "dialog__title", text: title }),
      el("p", { class: "dialog__message", text: message }),
      el("div", { class: "dialog__actions" },
        el("button", {
          class: "btn", type: "button", text: cancelText || I18N.t("keepEditing"),
          onclick: () => { handle.close(); resolve(false); },
        }),
        el("button", {
          class: "btn " + (okClass || "btn--primary"), type: "button", text: okText || I18N.t("send"),
          onclick: () => { handle.close(); resolve(true); },
        }),
      ),
    );
    handle = openDialog(panel);
  });
}

/** Unsaved-changes guard: Save / Discard / Cancel (Cancel is the default). */
function unsavedDialog() {
  return new Promise((resolve) => {
    let handle;
    const cancelBtn = el("button", {
      class: "btn", type: "button", text: I18N.t("keepEditing"),
      onclick: () => { handle.close(); resolve("cancel"); },
    });
    const panel = el("div", {},
      el("h2", { class: "dialog__title", text: I18N.t("unsavedTitle") }),
      el("p", { class: "dialog__message", text: I18N.t("unsavedMessage") }),
      el("div", { class: "dialog__actions" },
        el("button", {
          class: "btn btn--danger", type: "button", text: I18N.t("discard"),
          onclick: () => { handle.close(); resolve("discard"); },
        }),
        el("button", {
          class: "btn btn--primary", type: "button", text: I18N.t("saveChanges"),
          onclick: () => { handle.close(); resolve("save"); },
        }),
        cancelBtn,
      ),
    );
    handle = openDialog(panel, { initialFocus: cancelBtn });
  });
}

/* ---- Context menu ---- */

function closeContextMenu() {
  const menu = document.querySelector(".menu");
  if (menu) menu.remove();
}

function openContextMenu(anchor, items) {
  closeContextMenu();
  const menu = el("div", { class: "menu", role: "menu" });
  for (const item of items) {
    if (item.sep) {
      menu.append(el("div", { class: "menu__sep" }));
      continue;
    }
    menu.append(el("button", {
      class: "menu__item" + (item.danger ? " menu__item--danger" : ""),
      type: "button",
      role: "menuitem",
      text: item.label,
      disabled: item.disabled || undefined,
      title: item.title || undefined,
      onclick: () => {
        closeContextMenu();
        item.action();
      },
    }));
  }
  document.body.append(menu);
  const rect = anchor.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();
  let x = rect.left;
  let y = rect.bottom + 4;
  if (x + menuRect.width > window.innerWidth - 8) x = window.innerWidth - menuRect.width - 8;
  if (y + menuRect.height > window.innerHeight - 8) y = rect.top - menuRect.height - 4;
  menu.style.left = Math.max(8, x) + "px";
  menu.style.top = Math.max(8, y) + "px";
  const first = menu.querySelector("button:not(:disabled)");
  if (first) first.focus();
}

document.addEventListener("click", (event) => {
  const menu = document.querySelector(".menu");
  if (menu && !menu.contains(event.target)) closeContextMenu();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeContextMenu();
    closeTopOverlay();
  }
});

/* ---- Environment manager ---- */

function openEnvironmentManager() {
  let selectedId = State.settings.selectedEnvId || (State.environments[0] && State.environments[0].id) || null;

  let list, editor, handle;
  const rerender = () => {
    renderEnvList();
    renderEnvEditor();
  };

  const content = el("div", {},
    el("h2", { class: "dialog__title", text: I18N.t("envManagerTitle") }),
    el("div", { class: "env-manager" },
      el("div", { class: "env-list", id: "env-list" }),
      el("div", { class: "env-editor", id: "env-editor" }),
    ),
    el("div", { class: "dialog__actions" },
      el("button", {
        class: "btn", type: "button", text: I18N.t("keepEditing"),
        onclick: () => { handle.close(); Editor.refreshEnvSelector(); },
      }),
    ),
  );

  handle = openDialog(content, { wide: true });

  function currentEnv() {
    return State.environments.find((env) => env.id === selectedId) || null;
  }

  function renderEnvList() {
    list = content.querySelector("#env-list");
    list.textContent = "";
    for (const env of State.environments) {
      const item = el("button", {
        class: "env-list__item" + (env.id === selectedId ? " env-list__item--active" : ""),
        type: "button",
        onclick: () => { selectedId = env.id; rerender(); },
      },
        el("span", { text: env.name, style: "flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }),
        env.prodLike ? el("span", { class: "badge badge--prod", text: I18N.t("prodBadge") }) : null,
      );
      list.append(item);
    }
    list.append(el("div", { style: "padding:6px" },
      el("button", {
        class: "btn btn--sm btn--ghost", type: "button",
        onclick: () => {
          const env = newEnvironment();
          State.environments.push(env);
          selectedId = env.id;
          scheduleSave();
          rerender();
        },
      }, icon("plus"), I18N.t("newEnv")),
    ));
  }

  function renderEnvEditor() {
    editor = content.querySelector("#env-editor");
    editor.textContent = "";
    const env = currentEnv();
    if (!env) {
      editor.append(el("div", { class: "empty", text: I18N.t("noEnvSelected") }));
      return;
    }

    const nameInput = el("input", { class: "input", type: "text", value: env.name, "aria-label": I18N.t("envName") });
    nameInput.addEventListener("change", () => {
      env.name = nameInput.value.trim() || env.name;
      nameInput.value = env.name;
      scheduleSave();
      renderEnvList();
    });

    const prodBox = el("input", { type: "checkbox" });
    prodBox.checked = !!env.prodLike;
    prodBox.addEventListener("change", () => {
      env.prodLike = prodBox.checked;
      scheduleSave();
      renderEnvList();
      Editor.refreshEnvSelector();
    });

    const confirmBox = el("input", { type: "checkbox" });
    confirmBox.checked = env.confirmUnsafe !== false;
    confirmBox.addEventListener("change", () => {
      env.confirmUnsafe = confirmBox.checked;
      scheduleSave();
    });

    const delBtn = el("button", {
      class: "btn btn--sm btn--danger", type: "button", text: I18N.t("deleteEnv"),
      onclick: async () => {
        const ok = await confirmDialog({
          title: I18N.t("deleteEnv"),
          message: I18N.t("deleteEnvConfirm", { name: env.name }),
          okText: I18N.t("deleteEnv"),
          okClass: "btn--danger",
        });
        if (!ok) return;
        State.environments = State.environments.filter((e) => e.id !== env.id);
        if (State.settings.selectedEnvId === env.id) State.settings.selectedEnvId = null;
        selectedId = State.environments[0] ? State.environments[0].id : null;
        scheduleSave();
        rerender();
        Editor.refreshEnvSelector();
      },
    });

    editor.append(
      el("div", { class: "env-editor__head" },
        nameInput,
        delBtn,
      ),
      el("label", { class: "checkbox" }, prodBox, el("span", { text: I18N.t("prodLike") })),
      el("label", { class: "checkbox" }, confirmBox, el("span", { text: I18N.t("confirmUnsafe") })),
      el("div", { class: "hint", text: I18N.t("secretNote") }),
    );

    const varsBox = el("div", { class: "env-vars" });
    editor.append(varsBox);

    const rerenderRows = () => renderEnvVars(env, varsBox, rerenderRows);
    rerenderRows();
  }

  function renderEnvVars(env, varsBox, rerenderRows) {
    varsBox.textContent = "";
    const rows = env.variables;
    for (const row of rows) {
      const nameInput = el("input", {
        class: "kv-input mono", type: "text", value: row.name,
        "aria-label": I18N.t("key"), placeholder: "name", spellcheck: "false",
      });
      nameInput.addEventListener("input", () => { row.name = nameInput.value; scheduleSave(); });

      const valueInput = el("input", {
        class: "kv-input mono",
        type: row.secret && !row.reveal ? "password" : "text",
        value: row.value,
        "aria-label": I18N.t("value"), placeholder: "value", spellcheck: "false",
      });
      valueInput.addEventListener("input", () => { row.value = valueInput.value; scheduleSave(); });

      const revealBtn = el("button", {
        class: "icon-btn", type: "button",
        "aria-label": row.reveal ? "Hide value" : "Reveal value",
        onclick: () => {
          row.reveal = !row.reveal;
          valueInput.type = row.secret && !row.reveal ? "password" : "text";
          revealBtn.replaceChildren(icon(row.reveal ? "eyeOff" : "eye"));
        },
      }, icon(row.reveal ? "eyeOff" : "eye"));

      const secretBox = el("input", { type: "checkbox", "aria-label": I18N.t("secret") });
      secretBox.checked = !!row.secret;
      secretBox.addEventListener("change", () => {
        row.secret = secretBox.checked;
        scheduleSave();
      });

      varsBox.append(el("div", { class: "env-var-row" },
        nameInput,
        el("div", { class: "secret-wrap", style: "display:flex" }, valueInput, revealBtn),
        el("label", { class: "checkbox", title: I18N.t("secretNote") }, secretBox, el("span", { class: "hint", text: I18N.t("secret") })),
        el("span"),
        el("button", {
          class: "icon-btn", type: "button", "aria-label": I18N.t("deleteRow"),
          onclick: () => {
            rows.splice(rows.indexOf(row), 1);
            scheduleSave();
            rerenderRows();
          },
        }, icon("trash")),
      ));
    }
    varsBox.append(el("div", { style: "padding:6px 0" },
      el("button", {
        class: "btn btn--sm btn--ghost", type: "button",
        onclick: () => {
          rows.push({ name: "", value: "", secret: false });
          scheduleSave();
          rerenderRows();
        },
      }, icon("plus"), I18N.t("addVariable")),
    ));
  }

  rerender();
}
