<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API Studio</title>
<style>
/* ============================================================
   DBX API Studio — workbench styles.
   Only DBX semantic tokens are consumed, each with an accessible
   local fallback so the UI also renders in the dev host. Fallbacks
   switch with body[data-fallback="dark"] when the host reports a
   dark appearance.
   ============================================================ */

:root {
  --api-bg: var(--color-background, #ffffff);
  --api-surface: var(--color-card, #ffffff);
  --api-surface-2: var(--color-muted, #f6f7f9);
  --api-fg: var(--color-foreground, #18181b);
  --api-muted: var(--color-muted-foreground, #5f6b7a);
  --api-border: var(--color-border, #e2e8f0);
  --api-primary: var(--color-primary, #16794a);
  --api-primary-fg: var(--color-primary-foreground, #ffffff);
  --api-danger: var(--color-destructive, #dc2626);
  --api-warning: var(--color-warning, #b45309);
  --api-info: var(--color-info, #1d4ed8);
  --api-focus: var(--color-focus, #16794a);
  --api-radius: var(--radius, 8px);
  --api-radius-sm: calc(var(--radius, 8px) / 2);
  --api-font: var(--font-sans, -apple-system, "Segoe UI", system-ui, sans-serif);
  --api-mono: var(--font-mono, ui-monospace, "Cascadia Code", Consolas, monospace);
  /* JSON syntax colors: checked for 4.5:1 on both light and dark surfaces. */
  --api-json-key: var(--color-json-key, #7c2d92);
  --api-json-string: var(--color-json-string, #16794a);
  --api-json-number: var(--color-json-number, #1d4ed8);
  --api-json-literal: var(--color-json-literal, #b45309);
  --api-header-h: 44px;
}

body[data-fallback="dark"] {
  --api-bg: var(--color-background, #141618);
  --api-surface: var(--color-card, #1d2023);
  --api-surface-2: var(--color-muted, #26292d);
  --api-fg: var(--color-foreground, #e6e8ea);
  --api-muted: var(--color-muted-foreground, #9aa3ad);
  --api-border: var(--color-border, #3a3f45);
  --api-primary: var(--color-primary, #34c983);
  --api-primary-fg: var(--color-primary-foreground, #06210f);
  --api-danger: var(--color-destructive, #f87171);
  --api-warning: var(--color-warning, #fbbf24);
  --api-info: var(--color-info, #93b4ff);
  --api-focus: var(--color-focus, #34c983);
  --api-json-key: var(--color-json-key, #d8b4fe);
  --api-json-string: var(--color-json-string, #6ee7a0);
  --api-json-number: var(--color-json-number, #93b4ff);
  --api-json-literal: var(--color-json-literal, #fbbf24);
}

* { box-sizing: border-box; }

/* Author display rules elsewhere must never resurrect hidden elements. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--api-font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--api-fg);
  background: var(--api-bg);
  overflow: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--api-focus);
  outline-offset: 1px;
  border-radius: 2px;
}

.mono { font-family: var(--api-mono); }
.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- App layout ---------- */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w, 288px) 4px 1fr;
  height: 100%;
}

.app[hidden] { display: none; }

.main-col {
  display: grid;
  grid-template-rows: var(--api-header-h) minmax(0, var(--editor-h, 46%)) 4px minmax(0, 1fr);
  min-width: 0;
  min-height: 0;
}

/* ---------- Generic controls ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius-sm);
  background: var(--api-surface);
  color: var(--api-fg);
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 150ms ease, border-color 150ms ease;
}
.btn:hover:not(:disabled) { background: var(--api-surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn--primary {
  background: var(--api-primary);
  border-color: var(--api-primary);
  color: var(--api-primary-fg);
  font-weight: 600;
}
.btn--primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--api-primary); }

.btn--danger { color: var(--api-danger); border-color: var(--api-danger); background: transparent; }
.btn--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--api-danger) 10%, transparent); }

.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover:not(:disabled) { background: var(--api-surface-2); }

.btn--sm { height: 26px; padding: 0 8px; font-size: 12px; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 32px;
  border: none;
  border-radius: var(--api-radius-sm);
  background: transparent;
  color: var(--api-muted);
  cursor: pointer;
}
.icon-btn:hover:not(:disabled) { background: var(--api-surface-2); color: var(--api-fg); }
.icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.input, .select {
  height: 32px;
  padding: 0 8px;
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius-sm);
  background: var(--api-surface);
  color: var(--api-fg);
  min-width: 0;
}
.input::placeholder { color: var(--api-muted); }
.input:focus, .select:focus, .textarea:focus {
  outline: 2px solid var(--api-focus);
  outline-offset: -1px;
}
.textarea {
  padding: 8px;
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius-sm);
  background: var(--api-surface);
  color: var(--api-fg);
  resize: none;
}
.input--error, .textarea--error { border-color: var(--api-danger); }

.checkbox {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
.checkbox input { accent-color: var(--api-primary); width: 14px; height: 14px; }

/* ---------- Badges & chips ---------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.badge--prod {
  background: color-mix(in srgb, var(--api-danger) 14%, transparent);
  color: var(--api-danger);
  border: 1px solid color-mix(in srgb, var(--api-danger) 45%, transparent);
}
.badge--warn {
  background: color-mix(in srgb, var(--api-warning) 14%, transparent);
  color: var(--api-warning);
  border: 1px solid color-mix(in srgb, var(--api-warning) 45%, transparent);
}

.method {
  display: inline-block;
  min-width: 46px;
  padding: 1px 6px;
  border-radius: 4px;
  font-family: var(--api-mono);
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  border: 1px solid transparent;
}
.method--GET  { color: #15803d; background: color-mix(in srgb, #22c55e 15%, transparent); border-color: color-mix(in srgb, #22c55e 40%, transparent); }
.method--POST { color: #b45309; background: color-mix(in srgb, #f97316 15%, transparent); border-color: color-mix(in srgb, #f97316 40%, transparent); }
.method--PUT  { color: #1d4ed8; background: color-mix(in srgb, #3b82f6 15%, transparent); border-color: color-mix(in srgb, #3b82f6 40%, transparent); }
.method--PATCH{ color: #7c2d92; background: color-mix(in srgb, #a855f7 15%, transparent); border-color: color-mix(in srgb, #a855f7 40%, transparent); }
.method--DELETE { color: #b91c1c; background: color-mix(in srgb, #ef4444 15%, transparent); border-color: color-mix(in srgb, #ef4444 40%, transparent); }
body[data-fallback="dark"] .method--GET  { color: #4ade80; }
body[data-fallback="dark"] .method--POST { color: #fb923c; }
body[data-fallback="dark"] .method--PUT  { color: #60a5fa; }
body[data-fallback="dark"] .method--PATCH{ color: #c084fc; }
body[data-fallback="dark"] .method--DELETE { color: #f87171; }

.status-dot {
  display: inline-block;
  width: 9px; height: 9px;
  border-radius: 50%;
  flex: none;
}
.status-dot--2xx { background: #16a34a; }
.status-dot--3xx { background: #2563eb; }
.status-dot--4xx { background: #ea580c; }
.status-dot--5xx { background: #dc2626; }
.status-dot--err { background: var(--api-danger); }
.status-dot--cancelled { background: var(--api-muted); }

/* ---------- Sidebar ---------- */

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--api-surface);
  border-right: 1px solid var(--api-border);
}

.sidebar__actions {
  display: flex;
  gap: 8px;
  padding: 10px 12px 8px;
}
.sidebar__actions .btn { flex: 1; justify-content: center; }

.sidebar__search { padding: 0 12px 8px; }
.sidebar__search .input { width: 100%; }

.sidebar__body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 0 6px 12px;
}

.tree-section { margin-top: 4px; }
.tree-section__head {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 4px 6px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  color: var(--api-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-radius: var(--api-radius-sm);
}
.tree-section__head:hover { background: var(--api-surface-2); color: var(--api-fg); }
.tree-section__head .chevron { transition: transform 150ms ease; }
.tree-section__head[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
.tree-section__count { font-weight: 400; }
.tree-section__spacer { flex: 1; }

.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: 28px;
  padding: 2px 6px;
  border: none;
  border-left: 2px solid transparent;
  border-radius: var(--api-radius-sm);
  background: transparent;
  cursor: pointer;
  text-align: left;
  color: var(--api-fg);
}
.tree-row:hover { background: var(--api-surface-2); }
.tree-row--active {
  background: var(--api-surface-2);
  border-left-color: var(--api-primary);
  font-weight: 600;
}
.tree-row .name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree-row .chevron {
  flex: none;
  color: var(--api-muted);
  transition: transform 150ms ease;
}
.tree-row[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
.tree-row__actions { visibility: hidden; }
.tree-row:hover .tree-row__actions,
.tree-row:focus-within .tree-row__actions { visibility: visible; }
.tree-children { margin-left: 14px; }
.tree-row--dim { opacity: 0.55; }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 24px 16px;
  color: var(--api-muted);
  text-align: center;
  font-size: 13px;
}

.history-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: 28px;
  padding: 2px 6px;
  border: none;
  border-radius: var(--api-radius-sm);
  background: transparent;
  cursor: pointer;
  text-align: left;
  color: var(--api-fg);
}
.history-row:hover { background: var(--api-surface-2); }
.history-row .url {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--api-mono);
  font-size: 12px;
}
.history-row .meta { color: var(--api-muted); font-size: 11px; flex: none; }

/* ---------- Splitters ---------- */

.splitter { position: relative; touch-action: none; }
.splitter--v { cursor: col-resize; }
.splitter--h { cursor: row-resize; }
.splitter::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--api-border);
  transition: background-color 150ms ease;
}
.splitter:hover::after, .splitter--active::after { background: var(--api-primary); }
.splitter--v::after { left: 1px; right: 1px; }
.splitter--h::after { top: 1px; bottom: 1px; }

/* ---------- Editor header (breadcrumb + env) ---------- */

.editor-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-bottom: 1px solid var(--api-border);
  background: var(--api-surface);
  min-width: 0;
}
.editor-head__crumb {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  white-space: nowrap;
  font-size: 13px;
}
.editor-head__crumb .crumb-dim { color: var(--api-muted); }
.editor-head__crumb .crumb-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.dirty-mark { color: var(--api-warning); font-weight: 700; margin-left: 2px; }

.editor-head__env {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.editor-head__env .select { max-width: 180px; }

/* ---------- Command row ---------- */

.command-row {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
}
.method-select { width: 108px; font-family: var(--api-mono); font-weight: 700; flex: none; }
.url-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
}
.url-mirror {
  position: absolute;
  inset: 1px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-family: var(--api-mono);
  font-size: 14px;
  white-space: pre;
  overflow: hidden;
  pointer-events: none;
  color: var(--api-fg);
  background: var(--api-surface);
  border-radius: var(--api-radius-sm);
}
.url-mirror .url-var {
  background: color-mix(in srgb, var(--api-warning) 18%, transparent);
  color: var(--api-warning);
  border-radius: 4px;
  padding: 1px 2px;
  font-weight: 600;
}
.url-input {
  flex: 1;
  min-width: 0;
  height: 34px;
  font-family: var(--api-mono);
  background: transparent;
}
/* Input text renders via the mirror; keep caret + selection usable. */
.url-wrap .url-input { color: transparent; caret-color: var(--api-fg); }
.url-wrap .url-input::selection { background: color-mix(in srgb, var(--api-primary) 30%, transparent); }
.command-row .btn--send { flex: none; min-width: 84px; justify-content: center; }
.command-row .btn--save { flex: none; }

/* ---------- Tabs ---------- */

.tabs {
  display: flex;
  gap: 2px;
  padding: 0 12px;
  border-bottom: 1px solid var(--api-border);
  background: var(--api-surface);
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 10px;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--api-muted);
  cursor: pointer;
  font-weight: 500;
}
.tab:hover { color: var(--api-fg); }
.tab[aria-selected="true"] {
  color: var(--api-fg);
  border-bottom-color: var(--api-primary);
  font-weight: 600;
}
.tab__count {
  min-width: 18px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--api-surface-2);
  border: 1px solid var(--api-border);
  color: var(--api-muted);
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ---------- Request panels ---------- */

.request-panel {
  overflow: auto;
  min-height: 0;
  padding: 12px;
  background: var(--api-bg);
}
.panel-stack { display: flex; flex-direction: column; gap: 8px; }

.field-error {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--api-danger);
  font-size: 12px;
  padding: 2px 0;
}
.field-error svg { flex: none; }
#json-status:not(.field-error) { color: var(--api-primary); }

.hint { color: var(--api-muted); font-size: 12px; }

.section-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--api-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 4px 0;
}

/* KV editor */
.kv { border: 1px solid var(--api-border); border-radius: var(--api-radius); overflow: hidden; }
.kv__head, .kv-row {
  display: grid;
  grid-template-columns: 28px minmax(120px, 1fr) minmax(140px, 1.4fr) minmax(100px, 1fr) 56px;
  gap: 6px;
  align-items: center;
  padding: 2px 8px;
}
.kv__head {
  background: var(--api-surface-2);
  color: var(--api-muted);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 4px 8px;
  border-bottom: 1px solid var(--api-border);
}
.kv-row { border-bottom: 1px solid var(--api-border); background: var(--api-surface); }
.kv-row:last-child { border-bottom: none; }
.kv-row--disabled .kv-input { opacity: 0.55; }
.kv-input {
  height: 28px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  padding: 0 6px;
  width: 100%;
}
.kv-input:hover { border-color: var(--api-border); }
.kv-input:focus {
  border-color: var(--api-focus);
  background: var(--api-surface);
  outline: none;
}
.kv-row__menu { display: flex; justify-content: flex-end; }
.kv-row .icon-btn { width: 28px; height: 26px; }
.kv__empty { padding: 10px; }
.kv__foot { padding: 4px 8px; border-top: 1px solid var(--api-border); background: var(--api-surface); }

.secret-wrap { position: relative; display: flex; align-items: center; }
.secret-wrap .kv-input { padding-right: 28px; }
.secret-wrap .icon-btn {
  position: absolute;
  right: 0;
  width: 26px; height: 26px;
}

/* Auth */
.auth-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius);
  overflow: hidden;
  background: var(--api-surface);
  min-height: 260px;
}
.auth-rail { border-right: 1px solid var(--api-border); background: var(--api-surface-2); padding: 4px; }
.auth-rail__item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: none;
  border-radius: var(--api-radius-sm);
  background: transparent;
  cursor: pointer;
  text-align: left;
  color: var(--api-fg);
  font-size: 13px;
}
.auth-rail__item:hover { background: color-mix(in srgb, var(--api-primary) 8%, transparent); }
.auth-rail__item[aria-selected="true"] {
  background: var(--api-surface);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--api-border);
}
.auth-detail { padding: 14px 16px; min-width: 0; }
.auth-detail__title { font-size: 14px; font-weight: 700; margin: 0 0 2px; }
.auth-detail__desc { color: var(--api-muted); font-size: 13px; margin: 0 0 14px; }
.auth-detail__field { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; max-width: 560px; margin-bottom: 10px; }
.auth-detail__field > label { font-size: 13px; color: var(--api-muted); }
.auth-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  max-width: 560px;
  padding: 9px 12px;
  border-radius: var(--api-radius-sm);
  border: 1px solid color-mix(in srgb, var(--api-info) 35%, transparent);
  background: color-mix(in srgb, var(--api-info) 8%, var(--api-surface));
  color: var(--api-muted);
  font-size: 13px;
}
.auth-hint .link-btn {
  margin-left: auto;
  border: none;
  background: transparent;
  color: var(--api-info);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-size: 13px;
}
.auth-hint .link-btn:hover { text-decoration: underline; }
.auth-session-note { margin-top: 10px; }

/* Body */
.body-toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.body-toolbar .spacer { flex: 1; }
.body-editor-wrap { position: relative; border: 1px solid var(--api-border); border-radius: var(--api-radius); overflow: hidden; background: var(--api-surface); }
.body-editor {
  display: flex;
  font-family: var(--api-mono);
  font-size: 13px;
  line-height: 1.5;
  min-height: 160px;
  max-height: 320px;
}
.body-gutter {
  flex: none;
  width: 44px;
  padding: 8px 6px 8px 0;
  text-align: right;
  color: var(--api-muted);
  background: var(--api-surface-2);
  border-right: 1px solid var(--api-border);
  overflow: hidden;
  user-select: none;
  font-size: 12px;
}
.body-textarea {
  flex: 1;
  border: none;
  resize: none;
  background: transparent;
  padding: 8px;
  white-space: pre;
  overflow: auto;
  min-height: 160px;
  max-height: 320px;
  tab-size: 2;
}
.body-textarea:focus { outline: none; }

.settings-grid {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 10px 16px;
  align-items: center;
  max-width: 560px;
}
.settings-grid .input { max-width: 160px; }
.tls-warning { margin-top: 12px; max-width: 560px; }

/* ---------- Response area ---------- */

.response-area {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--api-bg);
}
.response-summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--api-border);
  background: var(--api-surface);
  min-height: 40px;
  flex-wrap: wrap;
}
.response-summary .stat { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.response-summary .stat .mono { font-size: 12px; }
.response-summary__spacer { flex: 1; }
.response-summary .status-text { font-weight: 600; }

.response-body-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.response-body-wrap--sending { opacity: 0.45; }
.sending-note {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--api-surface);
  border: 1px solid var(--api-border);
  box-shadow: 0 2px 10px color-mix(in srgb, #000 18%, transparent);
  font-size: 13px;
}
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--api-border);
  border-top-color: var(--api-primary);
  border-radius: 50%;
  animation: api-spin 0.8s linear infinite;
}
@keyframes api-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  * { transition-duration: 0.01ms !important; }
}

.error-card {
  margin: 12px;
  padding: 12px 14px;
  border: 1px solid color-mix(in srgb, var(--api-danger) 45%, transparent);
  border-left: 3px solid var(--api-danger);
  border-radius: var(--api-radius);
  background: color-mix(in srgb, var(--api-danger) 7%, var(--api-surface));
}
.error-card__title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--api-danger); }
.error-card__cause { margin: 6px 0; font-family: var(--api-mono); font-size: 12px; word-break: break-all; color: var(--api-muted); }
.error-card__next { font-size: 13px; margin: 4px 0 10px; }

.truncate-note {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 12px 0;
  padding: 8px 12px;
  border-radius: var(--api-radius);
  border: 1px solid color-mix(in srgb, var(--api-warning) 45%, transparent);
  background: color-mix(in srgb, var(--api-warning) 10%, var(--api-surface));
  color: var(--api-warning);
  font-size: 13px;
}
.truncate-note svg, .error-card__title svg, .auth-hint svg { flex: none; }

.cancelled-note {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px;
  padding: 10px 14px;
  border-radius: var(--api-radius);
  border: 1px solid var(--api-border);
  background: var(--api-surface);
  color: var(--api-muted);
}

/* response tab bar reuses .tabs; content region: */
.response-content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
}

.json-toolbar {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 6px 12px;
  border-bottom: 1px solid var(--api-border);
  background: var(--api-surface);
  flex-wrap: wrap;
}
.json-toolbar .input { height: 28px; width: 200px; }
.json-toolbar .spacer { flex: 1; }

.jsonview {
  font-family: var(--api-mono);
  font-size: 13px;
  line-height: 1.55;
  padding: 8px 12px 24px;
  user-select: text;
}
.jv-row { display: flex; align-items: baseline; }
.jv-toggle {
  flex: none;
  width: 18px;
  height: 18px;
  border: none;
  background: transparent;
  color: var(--api-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
}
.jv-toggle:hover { background: var(--api-surface-2); color: var(--api-fg); }
.jv-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
.jv-row--clickable { cursor: context-menu; border-radius: 3px; }
.jv-row--clickable:hover { background: var(--api-surface-2); }
.jv-key { color: var(--api-json-key); }
.jv-punct { color: var(--api-muted); }
.jv-string { color: var(--api-json-string); white-space: pre-wrap; word-break: break-all; }
.jv-number { color: var(--api-json-number); }
.jv-literal { color: var(--api-json-literal); }
.jv-summary { color: var(--api-muted); font-size: 12px; }
.jv-children { margin-left: 18px; border-left: 1px dotted var(--api-border); padding-left: 8px; }

.pre-code {
  margin: 0;
  padding: 8px 12px 24px;
  font-family: var(--api-mono);
  font-size: 13px;
  line-height: 1.55;
  white-space: pre;
  overflow: auto;
  user-select: text;
}

.headers-table { border-collapse: collapse; margin: 8px 12px 24px; font-size: 13px; }
.headers-table th, .headers-table td {
  text-align: left;
  padding: 5px 12px 5px 0;
  border-bottom: 1px solid var(--api-border);
  vertical-align: top;
}
.headers-table th { color: var(--api-muted); font-weight: 600; font-size: 12px; }
.headers-table td:first-child { font-family: var(--api-mono); color: var(--api-json-key); white-space: nowrap; }
.headers-table td:last-child { font-family: var(--api-mono); word-break: break-all; user-select: text; }

.timing-table { border-collapse: collapse; margin: 12px; max-width: 560px; width: calc(100% - 24px); }
.timing-table th, .timing-table td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--api-border); font-size: 13px; }
.timing-table th { color: var(--api-muted); font-size: 12px; font-weight: 600; }
.timing-table .bar-cell { width: 45%; }
.timing-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--api-surface-2);
  overflow: hidden;
}
.timing-bar__fill {
  height: 100%;
  border-radius: 4px;
  background: var(--api-primary);
}
.timing-na { color: var(--api-muted); }

/* ---------- Dialogs, menus, toast ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: color-mix(in srgb, #000 40%, transparent);
  display: grid;
  place-items: center;
}
.dialog {
  width: min(420px, calc(100vw - 48px));
  max-height: calc(100vh - 64px);
  overflow: auto;
  background: var(--api-surface);
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius);
  box-shadow: 0 12px 48px color-mix(in srgb, #000 30%, transparent);
  padding: 16px;
}
.dialog--wide { width: min(720px, calc(100vw - 48px)); }
.dialog__title { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
.dialog__message { margin: 0 0 14px; }
.dialog__field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.dialog__field label { font-size: 13px; font-weight: 600; }
.dialog__field .input { height: 32px; }
.dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 6px;
}
.dialog__error { color: var(--api-danger); font-size: 12px; margin-bottom: 8px; }

.menu {
  position: fixed;
  z-index: 80;
  min-width: 180px;
  padding: 4px;
  background: var(--api-surface);
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius-sm);
  box-shadow: 0 6px 24px color-mix(in srgb, #000 22%, transparent);
}
.menu__item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: none;
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  color: var(--api-fg);
  font-size: 13px;
}
.menu__item:hover, .menu__item:focus { background: var(--api-surface-2); outline: none; }
.menu__item--danger { color: var(--api-danger); }
.menu__item:disabled { opacity: 0.45; cursor: not-allowed; }
.menu__sep { height: 1px; margin: 4px 6px; background: var(--api-border); }

.toast-region {
  position: fixed;
  bottom: 14px;
  right: 14px;
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}
.toast {
  padding: 7px 12px;
  border-radius: var(--api-radius-sm);
  background: var(--api-fg);
  color: var(--api-bg);
  font-size: 13px;
  box-shadow: 0 4px 16px color-mix(in srgb, #000 25%, transparent);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 150ms ease, transform 150ms ease;
}
.toast--shown { opacity: 1; transform: none; }

/* ---------- Environment manager ---------- */

.env-manager { display: grid; grid-template-columns: 200px 1fr; gap: 12px; min-height: 320px; }
.env-list { border: 1px solid var(--api-border); border-radius: var(--api-radius); overflow: auto; background: var(--api-surface); }
.env-list__item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: none;
  border-bottom: 1px solid var(--api-border);
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.env-list__item:last-child { border-bottom: none; }
.env-list__item:hover { background: var(--api-surface-2); }
.env-list__item--active { background: var(--api-surface-2); font-weight: 600; }
.env-editor { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.env-editor__head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.env-editor__head .input { height: 30px; }
.env-vars { flex: 1; min-height: 0; overflow: auto; }
.env-var-row {
  display: grid;
  grid-template-columns: minmax(100px, 1fr) minmax(120px, 1.3fr) auto auto 28px;
  gap: 6px;
  align-items: center;
  padding: 2px 0;
}
.env-var-row .kv-input { border: 1px solid var(--api-border); border-radius: 4px; background: var(--api-surface); height: 28px; }

.boot {
  height: 100%;
  display: grid;
  place-items: center;
  color: var(--api-muted);
  gap: 10px;
}

@media (max-width: 900px) {
  .auth-layout { grid-template-columns: 1fr; }
  .auth-rail { display: flex; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--api-border); }
  .auth-rail__item { width: auto; }
  .settings-grid { grid-template-columns: 1fr; }
  .env-manager { grid-template-columns: 1fr; }
}

/* ---------- Response area with diagnostics panel ---------- */

.response-columns {
  flex: 1;
  min-height: 0;
  display: flex;
  min-width: 0;
}
.response-columns .response-body-wrap { flex: 1; min-width: 0; }
.diagnostics-panel {
  flex: none;
  width: 320px;
  border-left: 1px solid var(--api-border);
  background: var(--api-surface);
  overflow: auto;
  padding: 12px 14px 24px;
}
.diagnostics-panel h3 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 700;
  margin: 0 0 10px;
}
.diagnostics-panel h3 .mono { font-weight: 600; color: var(--api-fg); }
.diag-section { margin-bottom: 20px; }
.diag-row {
  display: grid;
  grid-template-columns: 1fr 64px;
  gap: 8px;
  align-items: center;
  padding: 4px 0;
  font-size: 13px;
}
.diag-row .mono { text-align: right; font-size: 12px; }
.diag-row--na { color: var(--api-muted); }
.diag-bar {
  grid-column: 1 / -1;
  height: 6px;
  border-radius: 3px;
  background: var(--api-surface-2);
  overflow: hidden;
  margin-top: -2px;
}
.diag-bar__fill { height: 100%; border-radius: 3px; background: var(--api-primary); transition: width 200ms ease; }
.diag-info { border-top: 1px solid var(--api-border); padding-top: 10px; }
.diag-info .diag-row { grid-template-columns: 88px 1fr; }
.diag-info .diag-row .mono { text-align: left; word-break: break-all; }
.diag-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 8px;
  border-radius: 4px;
  font-family: var(--api-mono);
  font-size: 12px;
  font-weight: 700;
  background: color-mix(in srgb, #16a34a 14%, transparent);
  color: #15803d;
}
body[data-fallback="dark"] .diag-status { color: #4ade80; }

@media (max-width: 1280px) {
  .diagnostics-panel { width: 280px; }
}

/* Pretty JSON with line numbers */
.pretty-json {
  display: flex;
  font-family: var(--api-mono);
  font-size: 13px;
  line-height: 1.55;
  overflow: auto;
  margin: 0 12px 24px;
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius);
  background: var(--api-surface);
  user-select: text;
}
.pretty-json__gutter {
  flex: none;
  padding: 8px 8px 8px 0;
  text-align: right;
  color: var(--api-muted);
  background: var(--api-surface-2);
  border-right: 1px solid var(--api-border);
  user-select: none;
  font-size: 12px;
  white-space: pre;
  position: sticky;
  left: 0;
}
.pretty-json__code {
  padding: 8px 12px;
  white-space: pre;
  margin: 0;
}
.pretty-json__code .pj-key { color: var(--api-json-key); }
.pretty-json__code .pj-string { color: var(--api-json-string); }
.pretty-json__code .pj-number { color: var(--api-json-number); }
.pretty-json__code .pj-literal { color: var(--api-json-literal); }

/* tree row count badge */
.tree-count {
  flex: none;
  min-width: 20px;
  height: 16px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--api-surface-2);
  border: 1px solid var(--api-border);
  color: var(--api-muted);
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.crumb-rename { width: 24px; height: 22px; }

/* ============================================================
   Polish layer (matches the reference design): gray app canvas,
   white cards, branded sidebar header, colored method text,
   split send button, merged response tab bar.
   Appended last on purpose — these rules override the base layer.
   ============================================================ */

:root {
  --api-json-key: #c92a2a;
  --api-json-string: #1a6fe8;
  --api-json-number: #0f172a;
  --api-json-literal: #d97706;
}
body[data-fallback="dark"] {
  --api-json-key: #ff8787;
  --api-json-string: #74c0fc;
  --api-json-number: #e9ecef;
  --api-json-literal: #ffa94d;
}

/* Gray canvas + white cards */
.app { background: var(--api-surface-2); }
.app--sidebar-collapsed { grid-template-columns: 0 0 1fr; }
.app--sidebar-collapsed .sidebar,
.app--sidebar-collapsed .splitter--v { display: none; }

.sidebar { background: var(--api-surface-2); }
.editor-head, .command-row, .request-panel { background: transparent; }
.tabs { background: transparent; }
.response-area { background: var(--api-surface-2); }
.response-columns, .response-content { background: var(--api-surface); }
.diagnostics-panel { background: var(--api-surface); }
.json-toolbar { background: var(--api-surface); }
.kv, .auth-layout, .body-editor-wrap, .pretty-json { box-shadow: 0 1px 2px color-mix(in srgb, #000 4%, transparent); }

/* Branded sidebar header */
.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 12px 10px 14px;
}
.sidebar-header__logo { width: 34px; height: 34px; flex: none; border-radius: 9px; }
.sidebar-header__text { min-width: 0; }
.sidebar-header__title { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.sidebar-header__subtitle {
  font-size: 12px;
  color: var(--api-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-header__spacer { flex: 1; }
.sidebar-header .icon-btn { width: 26px; height: 26px; font-weight: 700; }

/* Colored method text (reference style: text, not chips) */
.method-text {
  flex: none;
  width: 50px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.method-text--GET { color: #16a34a; }
.method-text--POST { color: #ea580c; }
.method-text--PUT { color: #2563eb; }
.method-text--PATCH { color: #9333ea; }
.method-text--DELETE { color: #dc2626; }
body[data-fallback="dark"] .method-text--GET { color: #4ade80; }
body[data-fallback="dark"] .method-text--POST { color: #fb923c; }
body[data-fallback="dark"] .method-text--PUT { color: #60a5fa; }
body[data-fallback="dark"] .method-text--PATCH { color: #c084fc; }
body[data-fallback="dark"] .method-text--DELETE { color: #f87171; }

.tree-section__head svg, .tree-row > svg:first-child { color: var(--api-muted); }

/* Method selector: borderless colored text */
.method-select {
  border-color: transparent;
  background: transparent;
  font-weight: 800;
  width: 96px;
}
.method-select:hover { border-color: var(--api-border); background: var(--api-surface); }
.method-select--GET { color: #16a34a; }
.method-select--POST { color: #ea580c; }
.method-select--PUT { color: #2563eb; }
.method-select--PATCH { color: #9333ea; }
.method-select--DELETE { color: #dc2626; }
body[data-fallback="dark"] .method-select--GET { color: #4ade80; }
body[data-fallback="dark"] .method-select--POST { color: #fb923c; }
body[data-fallback="dark"] .method-select--PUT { color: #60a5fa; }
body[data-fallback="dark"] .method-select--PATCH { color: #c084fc; }
body[data-fallback="dark"] .method-select--DELETE { color: #f87171; }

/* Split send button: [✈ 发送 | ▾] */
.send-group { display: inline-flex; flex: none; }
.send-group .btn--send {
  border-radius: var(--api-radius-sm) 0 0 var(--api-radius-sm);
  min-width: 96px;
  gap: 7px;
}
.send-caret {
  width: 24px;
  height: 32px;
  border: 1px solid var(--api-primary);
  border-left: 1px solid color-mix(in srgb, var(--api-primary-fg) 45%, transparent);
  background: var(--api-primary);
  color: var(--api-primary-fg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 0 var(--api-radius-sm) var(--api-radius-sm) 0;
}
.send-caret:hover { filter: brightness(1.06); }

/* URL variable pill: info blue like the reference */
.url-mirror .url-var {
  background: color-mix(in srgb, var(--api-info) 15%, transparent);
  color: var(--api-info);
  border-radius: 4px;
  padding: 1px 2px;
  font-weight: 600;
}

/* Auth rail: selected gets green tint + left accent; icons muted */
.auth-rail__item svg { color: var(--api-muted); flex: none; }
.auth-rail__item[aria-selected="true"] svg { color: var(--api-primary); }
.auth-rail__item[aria-selected="true"] {
  background: color-mix(in srgb, var(--api-primary) 11%, transparent);
  box-shadow: inset 2px 0 0 var(--api-primary);
}

/* Response tab bar: tabs + status summary in one row */
.response-tabbar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 8px 0 2px;
  border-bottom: 1px solid var(--api-border);
  flex-wrap: wrap;
}
.response-tabbar .tabs { border-bottom: none; padding: 0 0 0 2px; }
.response-summary {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-right: 2px;
}
.response-summary .stat { font-size: 12px; }
.response-summary .stat--status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  color: #15803d;
}
body[data-fallback="dark"] .response-summary .stat--status { color: #4ade80; }
.response-summary .icon-btn { width: 28px; height: 26px; }

/* JSON body toolbar chip */
.body-format-chip {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 8px;
  border: 1px solid var(--api-border);
  border-radius: var(--api-radius-sm);
  background: var(--api-surface);
  font-size: 12px;
  font-weight: 700;
  color: var(--api-muted);
  flex: none;
}

/* Diagnostics: big total bar like the reference */
.diag-total-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--api-surface-2);
  overflow: hidden;
  margin: 0 0 10px;
}
.diag-total-bar__fill {
  height: 100%;
  background: var(--api-primary);
  border-radius: 4px;
}

/* Breadcrumb */
.editor-head__crumb svg { color: var(--api-muted); flex: none; }

</style>

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "html") node.innerHTML = value;
      else if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2), value);
      } else if (key === "dataset") {
        Object.assign(node.dataset, value);
      } else {
        node.setAttribute(key, value);
      }
    }
  }
  for (const child of children.flat()) {
    if (child == null) continue;
    node.append(child);
  }
  return node;
}

function randomId() {
  const bytes = crypto.getRandomValues(new Uint8Array(9));
  return Array.from(bytes, (b) => b.toString(36).padStart(2, "0")).join("").slice(0, 16);
}

function uuid(prefix) {
  const core = crypto.randomUUID ? crypto.randomUUID() : randomId();
  return (prefix ? prefix + "_" : "") + core;
}

function debounce(fn, wait) {
  let timer;
  const wrapped = (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
  wrapped.cancel = () => clearTimeout(timer);
  return wrapped;
}

function formatBytes(bytes) {
  if (bytes == null) return "—";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function formatMs(ms) {
  if (ms == null) return "—";
  if (ms < 1000) return ms + " ms";
  return (ms / 1000).toFixed(2) + " s";
}

function formatTime(ts) {
  try {
    return new Date(ts).toLocaleTimeString(undefined, { hour12: false });
  } catch {
    return "";
  }
}

function timeAgo(ts) {
  const delta = Date.now() - ts;
  if (delta < 60_000) return I18N.t("justNow");
  if (delta < 3_600_000) return Math.floor(delta / 60_000) + " min";
  if (delta < 86_400_000) return Math.floor(delta / 3_600_000) + " h";
  return Math.floor(delta / 86_400_000) + " d";
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Sandbox fallback: transient textarea + legacy command.
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    area.remove();
    return ok;
  }
}

function toast(message) {
  const region = $("#toast-region");
  const node = el("div", { class: "toast", text: message });
  region.append(node);
  requestAnimationFrame(() => node.classList.add("toast--shown"));
  setTimeout(() => {
    node.classList.remove("toast--shown");
    setTimeout(() => node.remove(), 200);
  }, 1600);
}

function announce(message, polite) {
  const region = $(polite ? "#live-region-polite" : "#live-region");
  region.textContent = "";
  setTimeout(() => { region.textContent = message; }, 30);
}

function deepClone(value) {
  return value == null ? value : JSON.parse(JSON.stringify(value));
}

const STATE_VERSION = 1;
const UNSAFE_METHODS = ["POST", "PUT", "PATCH", "DELETE"];

const State = {
  version: STATE_VERSION,
  collections: [],
  environments: [],
  settings: {
    selectedEnvId: null,
    previewCapBytes: 2 * 1024 * 1024,
    ui: { sidebarWidth: 288, historyOpen: true, editorH: 46 },
  },
  history: [],

  // Editor: the request currently open. `location` is null while the request
  // is an unsaved draft (never yet written into a collection).
  current: null, // { requestId, request, collectionId, folderId, dirty }
  responses: new Map(), // requestId -> normalized response
  sending: null, // requestId while a request is in flight
  lastOutcome: null, // { kind: 'error', category, cause } | { kind: 'cancelled' }
  activeTab: "params",
  responseTab: "body",
  search: "",
  envManagerOpenFor: null,
};

function defaultRequest() {
  return {
    version: 1,
    name: "",
    method: "GET",
    url: "",
    query: [],
    headers: [],
    auth: { type: "none" },
    body: { type: "none", text: "" },
    variables: [],
    settings: {
      timeoutMs: 30000,
      followRedirects: true,
      maxRedirects: 10,
      verifyTls: true,
    },
  };
}

function newRow(key, value) {
  return { id: uuid("kv"), key: key || "", value: value || "", description: "", enabled: true };
}

function newRequestItem(name) {
  return {
    id: uuid("req"),
    type: "request",
    name: name || I18N.t("draftName"),
    request: defaultRequest(),
  };
}

function newCollection(name) {
  return { id: uuid("col"), type: "collection", name: name || "Collection", items: [] };
}

function newEnvironment(name) {
  return {
    id: uuid("env"),
    name: name || "Environment",
    prodLike: false,
    confirmUnsafe: true,
    variables: [],
  };
}

const REDACTED = "[REDACTED]";

/** Header names / markers that mark a value as a credential. Kept in sync with
 * the sidecar's `is_sensitive_header` (backend/src/model.rs). */
const SENSITIVE_HEADER_MARKERS = ["token", "secret", "api-key", "apikey", "password", "credential"];
const SENSITIVE_HEADER_NAMES = [
  "authorization", "proxy-authorization", "cookie", "set-cookie",
  "x-api-key", "api-key", "apikey", "x-auth-token", "x-access-token", "x-token",
  "x-csrf-token", "x-xsrf-token", "private-token", "x-amz-security-token",
  "x-goog-api-key", "x-secret",
];

function isSensitiveHeaderName(name) {
  const lower = String(name || "").trim().toLowerCase();
  if (!lower) return false;
  if (SENSITIVE_HEADER_NAMES.includes(lower)) return true;
  return SENSITIVE_HEADER_MARKERS.some((marker) => lower.includes(marker));
}

const SENSITIVE_QUERY_MARKERS = ["token", "secret", "key", "password", "passwd", "signature", "credential", "auth"];

function isSensitiveQueryName(name) {
  const lower = String(name || "").trim().toLowerCase();
  return SENSITIVE_QUERY_MARKERS.some((marker) => lower.includes(marker));
}

const VARIABLE_NAME_CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-.";

/** True when the whole string is a single {{name}} reference (a pointer, not a
 * secret). Only such values survive redaction. */
function isPlainVariableReference(value) {
  const trimmed = String(value || "").trim();
  if (trimmed.length < 5) return false;
  if (trimmed.slice(0, 2) !== "{{" || trimmed.slice(-2) !== "}}") return false;
  const name = trimmed.slice(2, -2).trim();
  if (!name) return false;
  for (const ch of name) {
    if (!VARIABLE_NAME_CHARS.includes(ch)) return false;
  }
  return true;
}

function redactCredentialValue(value) {
  const text = String(value || "");
  if (!text) return "";
  return isPlainVariableReference(text) ? text : REDACTED;
}

/** Drop a `scheme://user:pass@` userinfo section without touching the rest. */
function stripUrlUserinfo(url) {
  const schemeAt = url.indexOf("://");
  if (schemeAt < 0) return url;
  const authorityStart = schemeAt + 3;
  let authorityEnd = url.length;
  for (let i = authorityStart; i < url.length; i++) {
    const ch = url[i];
    if (ch === "/" || ch === "?" || ch === "#") {
      authorityEnd = i;
      break;
    }
  }
  const authority = url.slice(authorityStart, authorityEnd);
  const at = authority.lastIndexOf("@");
  if (at < 0) return url;
  return url.slice(0, authorityStart) + authority.slice(at + 1) + url.slice(authorityEnd);
}

/** Redact credential-bearing query values from a URL string, keeping its shape. */
function redactUrlForHistory(url) {
  let text = String(url || "");
  const hashIndex = text.indexOf("#");
  const hash = hashIndex >= 0 ? text.slice(hashIndex) : "";
  if (hashIndex >= 0) text = text.slice(0, hashIndex);
  const qIndex = text.indexOf("?");
  const base = stripUrlUserinfo(qIndex < 0 ? text : text.slice(0, qIndex));
  if (qIndex < 0) return base + hash;
  const redacted = text
    .slice(qIndex + 1)
    .split("&")
    .map((pair) => {
      const eq = pair.indexOf("=");
      if (eq < 0) return pair;
      const key = pair.slice(0, eq);
      return isSensitiveQueryName(safeDecode(key)) ? key + "=" + REDACTED : pair;
    })
    .join("&");
  return base + "?" + redacted + hash;
}

/** Auth-bearing fields of a request; these hold directly typed credentials. */
const AUTH_CREDENTIAL_FIELDS = {
  bearer: ["token"],
  basic: ["password"],
  apikey: ["keyValue"],
};

/**
 * Build the persistable copy of a request: credentials are stripped, only
 * `{{variable}}` references survive. Used for BOTH collection storage and
 * history snapshots so no save path can bypass redaction (PRD §6.4: a request
 * never stores resolved secret values).
 */
function sanitizeRequestForPersistence(request) {
  const copy = deepClone(request);
  const auth = copy.auth || { type: "none" };
  for (const field of AUTH_CREDENTIAL_FIELDS[auth.type] || []) {
    auth[field] = redactCredentialValue(auth[field]);
  }
  delete auth.reveal;
  copy.auth = auth;

  copy.variables = (copy.variables || []).map((variable) => ({
    name: variable.name,
    secret: !!variable.secret,
    value: variable.secret ? "" : String(variable.value || ""),
  }));

  copy.headers = (copy.headers || []).map((row) => ({
    ...row,
    value: isSensitiveHeaderName(row.key) ? redactCredentialValue(row.value) : row.value,
  }));

  copy.query = (copy.query || []).map((row) => ({
    ...row,
    value: isSensitiveQueryName(row.key) ? redactCredentialValue(row.value) : row.value,
  }));

  copy.url = redactUrlForHistory(copy.url);
  return copy;
}

/** History snapshot: never carries body text, credentials or resolved values. */
function redactRequestForHistory(request) {
  const copy = sanitizeRequestForPersistence(request);
  const body = copy.body || { type: "none" };
  const bodyLength = String(body.text || "").length;
  copy.body = { type: body.type || "none", text: "", redacted: true, sizeBytes: bodyLength };
  copy.variables = (copy.variables || []).map((variable) => ({ name: variable.name, value: "" }));
  return copy;
}

/** Locate an item plus its parent collection/folder. */
function findItem(id, items = null, parent = null) {
  const list = items || State.collections;
  for (const item of list) {
    if (item.id === id) return { item, parent };
    if (item.items) {
      const found = findItem(id, item.items, item);
      if (found) return found;
    }
  }
  return null;
}

function findCollectionOf(itemId) {
  const found = findItem(itemId);
  if (!found) return null;
  let node = found.item;
  let parent = found.parent;
  while (parent && parent.type !== "collection") {
    const up = findItem(parent.id);
    node = parent;
    parent = up ? up.parent : null;
  }
  return parent || (node.type === "collection" ? node : null);
}

function selectedEnvironment() {
  if (!State.settings.selectedEnvId) return null;
  return State.environments.find((env) => env.id === State.settings.selectedEnvId) || null;
}

/** Total variable scope: request-local wins over environment. */
function variableScope(request) {
  const scope = new Map();
  const env = selectedEnvironment();
  if (env) {
    for (const v of env.variables) {
      scope.set(v.name, { value: v.value, secret: !!v.secret, source: "environment" });
    }
  }
  for (const v of request.variables || []) {
    scope.set(v.name, { value: v.value, secret: false, source: "request" });
  }
  return scope;
}

/** Persisted state payload — every credential is stripped here (auth values that
 * are not {{references}}, secret-marked variables, credential headers/query
 * values), in addition to the sidecar's own scrub of history entries.
 *
 * Request bodies are stored as authored: PRD §6.4 lists `body` as part of a
 * stored request definition, and a body is authored request content rather than
 * a resolved-credential channel. Credential *channels* (auth fields, credential
 * named headers/query, secret variables) are the ones that must never persist —
 * only their `{{variable}}` references survive. History is stricter and keeps no
 * body text at all (`redactRequestForHistory`). */
function persistableState() {
  const environments = State.environments.map((env) => ({
    ...deepClone(env),
    variables: env.variables.map((v) => ({
      name: v.name,
      secret: !!v.secret,
      // Secret values are session-only; ordinary variables must survive a restart.
      value: v.secret ? "" : String(v.value || ""),
    })),
  }));
  const collections = State.collections.map((collection) => sanitizeTree(collection));
  return {
    version: STATE_VERSION,
    collections,
    environments,
    settings: deepClone(State.settings),
  };
}

/** Recursively copy a collection/folder tree, sanitizing every request. */
function sanitizeTree(node) {
  const copy = { ...deepClone(node) };
  if (Array.isArray(node.items)) {
    copy.items = node.items.map((item) =>
      item.type === "request" ? { ...deepClone(item), request: sanitizeRequestForPersistence(item.request) } : sanitizeTree(item),
    );
  }
  return copy;
}

const scheduleSave = debounce(() => {
  Api.saveState(persistableState()).catch((error) => {
    announce("Save failed: " + (error && error.message ? error.message : error));
  });
}, 600);
