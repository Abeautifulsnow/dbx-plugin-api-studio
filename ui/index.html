const Sidebar = (() => {
  let treeRoot;

  function init() {
    treeRoot = $("#tree-root");
    $("#btn-new-request").addEventListener("click", () => Editor.newRequest());
    $("#btn-new-collection").addEventListener("click", createCollection);
    $("#search-input").addEventListener("input", (event) => {
      State.search = event.target.value.trim();
      render();
    });
    render();
  }

  function refresh() {
    render();
  }

  async function createCollection() {
    const name = await promptDialog({
      title: I18N.t("newCollection"),
      label: I18N.t("collectionName"),
      value: "My Collection",
      okText: I18N.t("newCollection"),
    });
    if (!name) return;
    State.collections.push(newCollection(name));
    scheduleSave();
    render();
  }

  function matchesSearch(request, text) {
    if (!text) return true;
    const haystack = (request.name + " " + request.request.url + " " + request.request.method).toLowerCase();
    return text.toLowerCase().split(/\s+/).every((term) => haystack.includes(term));
  }

  function render() {
    if (!treeRoot) return;
    treeRoot.textContent = "";
    const query = State.search;

    const collectionsHead = el("button", {
      class: "tree-section__head",
      "aria-expanded": "true",
      onclick: (event) => toggleSection(event.currentTarget),
    },
      icon("folder"),
      el("span", { text: I18N.t("collections") }),
    );
    const collectionsBox = el("div", { class: "tree-section" }, collectionsHead);

    if (!State.collections.length) {
      collectionsBox.append(el("div", { class: "empty" },
        el("span", { text: I18N.t("emptyCollections") }),
        el("button", { class: "btn btn--sm", text: I18N.t("newCollection"), onclick: createCollection }),
      ));
    } else if (query) {
      const hits = renderSearchResults(query);
      if (!hits) {
        collectionsBox.append(el("div", { class: "empty", text: I18N.t("noSearchResults") }));
      }
    } else {
      for (const collection of State.collections) {
        collectionsBox.append(renderCollection(collection));
      }
    }
    treeRoot.append(collectionsBox);
    treeRoot.append(renderHistorySection());
  }

  function toggleSection(headButton) {
    const expanded = headButton.getAttribute("aria-expanded") === "true";
    headButton.setAttribute("aria-expanded", String(!expanded));
    let box = headButton.nextElementSibling;
    while (box) {
      box.hidden = expanded;
      box = box.nextElementSibling;
    }
  }

  function renderSearchResults(query) {
    let any = false;
    const flat = el("div");
    const visit = (items, parentCollection) => {
      for (const item of items) {
        if (item.type === "folder") {
          visit(item.items, parentCollection);
        } else if (matchesSearch(item, query)) {
          any = true;
          flat.append(renderRequestRow(item, parentCollection));
        }
      }
    };
    for (const collection of State.collections) {
      visit(collection.items, collection);
    }
    if (any) return flat;
    return null;
  }

  function countRequests(items) {
    let total = 0;
    for (const item of items) {
      if (item.type === "request") total++;
      else if (item.items) total += countRequests(item.items);
    }
    return total;
  }

  function renderCollection(collection) {
    const expanded = isExpanded(collection.id, true);
    const head = el("button", {
      class: "tree-row",
      "aria-expanded": String(expanded),
      onclick: () => { toggleExpanded(collection.id); render(); },
      oncontextmenu: (event) => {
        event.preventDefault();
        openCollectionMenu(event, collection);
      },
    },
      icon("folder"),
      el("span", { class: "name", text: collection.name }),
      el("span", { class: "tree-count", text: String(countRequests(collection.items)) }),
      collectionMenuButton(collection),
    );
    const children = el("div", { class: "tree-children" });
    children.hidden = !expanded;
    for (const item of collection.items) {
      children.append(item.type === "folder" ? renderFolder(item, collection) : renderRequestRow(item, collection));
    }
    if (!collection.items.length) {
      children.append(el("div", { class: "empty", text: I18N.t("newRequestIn") + " →" }));
    }
    return el("div", { class: "tree-section" }, head, children);
  }

  function collectionMenuButton(collection) {
    return el("span", { class: "tree-row__actions" },
      el("button", {
        class: "icon-btn", type: "button", "aria-label": I18N.t("moreActions"),
        "aria-haspopup": "menu",
        onclick: (event) => {
          event.stopPropagation();
          openCollectionMenu(event, collection);
        },
      }, icon("dots")),
    );
  }

  function openCollectionMenu(event, collection) {
    openContextMenu(event.currentTarget, [
      { label: I18N.t("newRequestIn"), action: () => Editor.newRequest({ collectionId: collection.id, folderId: null }) },
      { label: I18N.t("newFolder"), action: () => createFolder(collection, null) },
      { sep: true },
      { label: I18N.t("rename"), action: () => renameCollection(collection) },
      {
        label: I18N.t("deleteCollection"),
        danger: true,
        action: async () => {
          const ok = await confirmDialog({
            title: I18N.t("deleteCollection"),
            message: I18N.t("deleteCollectionConfirm", { name: collection.name }),
            okText: I18N.t("deleteCollection"),
            okClass: "btn--danger",
          });
          if (!ok) return;
          State.collections = State.collections.filter((c) => c.id !== collection.id);
          if (State.current && State.current.collectionId === collection.id) {
            Editor.markLocationDeleted();
          }
          scheduleSave();
          render();
        },
      },
    ]);
  }

  async function createFolder(collection, parentFolder) {
    const name = await promptDialog({
      title: I18N.t("newFolder"),
      label: I18N.t("folderName"),
      value: "Folder",
      okText: I18N.t("newFolder"),
    });
    if (!name) return;
    const folder = { id: uuid("fld"), type: "folder", name, items: [] };
    if (parentFolder) parentFolder.items.push(folder);
    else collection.items.push(folder);
    scheduleSave();
    render();
  }

  function folderMenu(event, folder, collection) {
    openContextMenu(event.currentTarget, [
      { label: I18N.t("newRequestIn"), action: () => Editor.newRequest({ collectionId: collection.id, folderId: folder.id }) },
      { label: I18N.t("newFolder"), action: () => createFolder(collection, folder) },
      { sep: true },
      {
        label: I18N.t("rename"),
        action: async () => {
          const name = await promptDialog({
            title: I18N.t("rename"), label: I18N.t("folderName"), value: folder.name, okText: I18N.t("rename"),
          });
          if (name) {
            folder.name = name;
            scheduleSave();
            render();
          }
        },
      },
      {
        label: I18N.t("deleteFolder"),
        danger: true,
        action: async () => {
          const ok = await confirmDialog({
            title: I18N.t("deleteFolder"),
            message: I18N.t("deleteFolderConfirm", { name: folder.name }),
            okText: I18N.t("deleteFolder"),
            okClass: "btn--danger",
          });
          if (!ok) return;
          const owner = findItem(folder.id);
          if (owner && owner.parent) {
            owner.parent.items = owner.parent.items.filter((i) => i.id !== folder.id);
          }
          scheduleSave();
          render();
        },
      },
    ]);
  }

  function renderFolder(folder, collection) {
    const expanded = isExpanded(folder.id, true);
    const head = el("button", {
      class: "tree-row",
      "aria-expanded": String(expanded),
      onclick: () => { toggleExpanded(folder.id); render(); },
      oncontextmenu: (event) => {
        event.preventDefault();
        folderMenu(event, folder, collection);
      },
    },
      icon("folder"),
      el("span", { class: "name", text: folder.name }),
      el("span", { class: "tree-count", text: String(countRequests(folder.items)) }),
      el("span", { class: "tree-row__actions" },
        el("button", {
          class: "icon-btn", type: "button", "aria-label": I18N.t("moreActions"),
          "aria-haspopup": "menu",
          onclick: (event) => {
            event.stopPropagation();
            folderMenu(event, folder, collection);
          },
        }, icon("dots")),
      ),
    );
    const children = el("div", { class: "tree-children" });
    children.hidden = !expanded;
    for (const item of folder.items) {
      children.append(item.type === "folder" ? renderFolder(item, collection) : renderRequestRow(item, collection));
    }
    return el("div", { class: "tree-section" }, head, children);
  }

  function requestMenu(event, item, collection) {
    openContextMenu(event.currentTarget, [
      { label: I18N.t("rename"), action: () => renameRequest(item, collection) },
      {
        label: I18N.t("duplicate"),
        action: () => {
          const owner = findItem(item.id);
          const clone = deepClone(item);
          clone.id = uuid("req");
          clone.name = item.name + " (copy)";
          if (owner && owner.parent) owner.parent.items.splice(owner.parent.items.indexOf(item) + 1, 0, clone);
          else collection.items.push(clone);
          scheduleSave();
          render();
        },
      },
      { sep: true },
      {
        label: I18N.t("deleteRequest"),
        danger: true,
        action: async () => {
          const ok = await confirmDialog({
            title: I18N.t("deleteRequest"),
            message: I18N.t("deleteRequestConfirm", { name: item.name }),
            okText: I18N.t("deleteRequest"),
            okClass: "btn--danger",
          });
          if (!ok) return;
          const owner = findItem(item.id);
          if (owner && owner.parent) {
            owner.parent.items = owner.parent.items.filter((i) => i.id !== item.id);
          }
          if (State.current && State.current.requestId === item.id) {
            Editor.markLocationDeleted();
          }
          scheduleSave();
          render();
        },
      },
    ]);
  }

  async function renameCollection(collection) {
    const name = await promptDialog({
      title: I18N.t("rename"), label: I18N.t("collectionName"), value: collection.name, okText: I18N.t("rename"),
    });
    if (name) {
      collection.name = name;
      scheduleSave();
      render();
    }
  }

  async function renameRequest(item, collection) {
    const name = await promptDialog({
      title: I18N.t("rename"), label: I18N.t("requestName"), value: item.name, okText: I18N.t("rename"),
    });
    if (!name) return;
    item.name = name;
    if (State.current && State.current.requestId === item.id) {
      State.current.request.name = name;
      Editor.refreshHeader();
    }
    scheduleSave();
    render();
  }

  function renderRequestRow(item, collection) {
    const active = State.current && State.current.requestId === item.id;
    const row = el("button", {
      class: "tree-row" + (active ? " tree-row--active" : ""),
      onclick: () => Editor.openRequest(item.id),
      oncontextmenu: (event) => {
        event.preventDefault();
        requestMenu(event, item, collection);
      },
      title: item.request.url || item.name,
    },
      el("span", { class: "method-text method-text--" + item.request.method, text: item.request.method }),
      el("span", { class: "name", text: item.name }),
      el("span", { class: "tree-row__actions" },
        el("button", {
          class: "icon-btn", type: "button", "aria-label": I18N.t("moreActions"),
          "aria-haspopup": "menu",
          onclick: (event) => {
            event.stopPropagation();
            requestMenu(event, item, collection);
          },
        }, icon("dots")),
      ),
    );
    return row;
  }

  function renderHistorySection() {
    const open = State.settings.ui.historyOpen;
    const section = el("div", { class: "tree-section" });
    const head = el("button", {
      class: "tree-section__head",
      "aria-expanded": String(open),
      onclick: () => {
        State.settings.ui.historyOpen = !open;
        scheduleSave();
        render();
      },
    },
      icon("clock"),
      el("span", { text: I18N.t("history") }),
      el("span", { class: "tree-section__count", text: String(State.history.length) }),
      el("span", { class: "tree-section__spacer" }),
    );
    if (open && State.history.length) {
      head.append(el("span", { class: "tree-row__actions" },
        el("button", {
          class: "icon-btn", type: "button", "aria-label": I18N.t("clearHistory"),
          style: "width:24px;height:22px",
          onclick: async (event) => {
            event.stopPropagation();
            const ok = await confirmDialog({
              title: I18N.t("history"),
              message: I18N.t("clearHistoryConfirm"),
              okText: I18N.t("clearHistory"),
              okClass: "btn--danger",
            });
            if (!ok) return;
            State.history = [];
            await Api.historyClear().catch(() => {});
            render();
          },
        }, icon("trash")),
      ));
    }
    section.append(head);

    if (open) {
      if (!State.history.length) {
        section.append(el("div", { class: "empty", text: I18N.t("emptyHistory") }));
      } else {
        const list = el("div");
        for (const entry of [...State.history].reverse().slice(0, 100)) {
          list.append(renderHistoryRow(entry));
        }
        section.append(list);
      }
    }
    return section;
  }

  function renderHistoryRow(entry) {
    const statusClass = entry.status == null
      ? (entry.error ? "status-dot--err" : "status-dot--cancelled")
      : "status-dot--" + String(entry.status)[0] + "xx";
    return el("button", {
      class: "history-row",
      onclick: () => Editor.restoreHistoryEntry(entry),
      title: entry.url,
    },
      el("span", { class: "method-text method-text--" + entry.method, text: entry.method }),
      el("span", { class: "url", text: entry.url || entry.name || "" }),
      el("span", { class: "meta" },
        el("span", { class: "status-dot " + statusClass }),
      ),
      el("span", { class: "meta", text: timeAgo(entry.timestamp) }),
    );
  }

  /* expanded-state helpers keep default-expanded behavior without
     persisting a full set of toggles. */
  const collapsed = new Set();
  function isExpanded(id, defaultOpen) {
    return defaultOpen ? !collapsed.has(id) : collapsed.has(id);
  }
  function toggleExpanded(id) {
    if (collapsed.has(id)) collapsed.delete(id);
    else collapsed.add(id);
  }

  return { init, refresh, render };
})();


/* ==== js/45-editor.js ==== */

/* ==== Request editor: header, command row, tabs, panels ==== */

const Editor = (() => {
  let urlInput, methodSelect, sendBtn, saveBtn;
  let renderUrlMirror = () => {};
  let syncingQuery = false;

  const TABS = [
    { id: "params", label: "tabParams" },
    { id: "headers", label: "tabHeaders" },
    { id: "auth", label: "tabAuth" },
    { id: "body", label: "tabBody" },
    { id: "settings", label: "tabSettings" },
  ];

  function init() {
    urlInput = $("#url-input");
    methodSelect = $("#method-select");
    sendBtn = $("#btn-send");
    saveBtn = $("#btn-save");

    for (const method of ["GET", "POST", "PUT", "PATCH", "DELETE"]) {
      methodSelect.append(el("option", { value: method, text: method }));
    }
    methodSelect.addEventListener("change", () => {
      mutateCurrent((request) => { request.method = methodSelect.value; });
      methodSelect.className = "select method-select method-select--" + methodSelect.value;
    });

    urlInput.addEventListener("input", () => {
      mutateCurrent((request) => {
        request.url = urlInput.value;
        syncQueryFromUrl(request);
      }, { skipUrlRefresh: true });
    });
    initUrlMirror();
    sendBtn.addEventListener("click", () => RequestFlow.sendOrCancel());
    $("#btn-send-caret").addEventListener("click", (event) => openRequestMenu(event));
    $("#btn-sidebar-collapse").addEventListener("click", () => {
      State.settings.ui.sidebarCollapsed = true;
      applySidebarCollapsed();
      scheduleSave();
    });
    $("#btn-sidebar-show").addEventListener("click", () => {
      State.settings.ui.sidebarCollapsed = false;
      applySidebarCollapsed();
      scheduleSave();
    });
    saveBtn.addEventListener("click", () => saveCurrent());
    $("#btn-env-manager").addEventListener("click", openEnvironmentManager);
    $("#env-select").addEventListener("change", (event) => {
      State.settings.selectedEnvId = event.target.value || null;
      scheduleSave();
      refreshEnvSelector();
      ResponseView.render();
    });
    $("#btn-request-menu").addEventListener("click", (event) => openRequestMenu(event));
    $("#splitter-response").addEventListener("keydown", splitterKeyNav);
    $("#splitter-sidebar").addEventListener("keydown", splitterKeyNav);

    initSplitters();
    applySidebarCollapsed();
    refreshActionButtons();
    renderTabs();
    refreshEnvSelector();
    refreshHeader();
    refreshCommandRow();
  }

  /** Icon-bearing action buttons (shell leaves them empty for i18n safety). */
  function refreshActionButtons() {
    sendBtn.replaceChildren(icon("send"), el("span", { text: I18N.t("send") }));
    saveBtn.replaceChildren(icon("save"), el("span", { text: I18N.t("save") }));
    $("#btn-send-caret").replaceChildren(icon("chevron"));
    $("#btn-env-manager").replaceChildren(icon("globe"));
    $("#btn-sidebar-collapse").replaceChildren(icon("chevronsLeft"));
    $("#btn-sidebar-show").replaceChildren(icon("chevronsRight"));
    $("#btn-request-menu").replaceChildren(icon("dots"));
    const envButton = $("#btn-env-manager");
    envButton.title = I18N.t("manageEnvironments");
    envButton.setAttribute("aria-label", I18N.t("manageEnvironments"));
  }

  function applySidebarCollapsed() {
    $(".app").classList.toggle("app--sidebar-collapsed", !!State.settings.ui.sidebarCollapsed);
    $("#btn-sidebar-show").hidden = !State.settings.ui.sidebarCollapsed;
  }

  /* ---- URL variable highlighting (mirror under a transparent-text input) ---- */

  function initUrlMirror() {
    const mirror = $("#url-mirror");
    const wrap = $("#url-wrap");
    renderUrlMirror = () => {
      const text = urlInput.value;
      const fragment = document.createDocumentFragment();
      let lastIndex = 0;
      text.replace(VAR_PATTERN, (match, name, offset) => {
        if (offset > lastIndex) fragment.append(document.createTextNode(text.slice(lastIndex, offset)));
        fragment.append(el("span", { class: "url-var", text: match }));
        lastIndex = offset + match.length;
        return match;
      });
      if (lastIndex < text.length) fragment.append(document.createTextNode(text.slice(lastIndex)));
      mirror.replaceChildren(fragment);
      mirror.scrollLeft = urlInput.scrollLeft;
    };
    urlInput.addEventListener("scroll", () => { mirror.scrollLeft = urlInput.scrollLeft; });
    wrap.dataset.mirrorReady = "1";
  }

  /* ---- splitters ---- */

  function initSplitters() {
    const sidebarSplitter = $("#splitter-sidebar");
    const responseSplitter = $("#splitter-response");
    const app = $(".app");
    const mainCol = $(".main-col");

    dragSplitter(sidebarSplitter, (event) => {
      const width = Math.min(440, Math.max(220, event.clientX));
      State.settings.ui.sidebarWidth = width;
      app.style.setProperty("--sidebar-w", width + "px");
    }, () => {
      app.style.setProperty("--sidebar-w", State.settings.ui.sidebarWidth + "px");
      scheduleSave();
    });

    dragSplitter(responseSplitter, (event) => {
      const rect = mainCol.getBoundingClientRect();
      const ratio = ((event.clientY - rect.top) / rect.height) * 100;
      const clamped = Math.min(80, Math.max(20, ratio));
      State.settings.ui.editorH = clamped;
      mainCol.style.setProperty("--editor-h", clamped + "%");
    }, () => {
      mainCol.style.setProperty("--editor-h", State.settings.ui.editorH + "%");
      scheduleSave();
    });

    app.style.setProperty("--sidebar-w", (State.settings.ui.sidebarWidth || 288) + "px");
    mainCol.style.setProperty("--editor-h", (State.settings.ui.editorH || 46) + "%");
  }

  function dragSplitter(handle, onMove, onEnd) {
    handle.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      handle.classList.add("splitter--active");
      handle.setPointerCapture(event.pointerId);
      const move = (moveEvent) => onMove(moveEvent);
      const up = (upEvent) => {
        handle.classList.remove("splitter--active");
        handle.releasePointerCapture(upEvent.pointerId);
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        if (onEnd) onEnd();
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
  }

  function splitterKeyNav(event) {
    const mainCol = $(".main-col");
    const step = event.shiftKey ? 8 : 2;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
    event.preventDefault();
    if (event.currentTarget.id === "splitter-sidebar") {
      const delta = event.key === "ArrowLeft" ? -step : step;
      State.settings.ui.sidebarWidth = Math.min(440, Math.max(220, State.settings.ui.sidebarWidth + delta));
      $(".app").style.setProperty("--sidebar-w", State.settings.ui.sidebarWidth + "px");
    } else {
      const delta = (event.key === "ArrowUp" ? -step : step) * 0.6;
      State.settings.ui.editorH = Math.min(80, Math.max(20, State.settings.ui.editorH + delta));
      mainCol.style.setProperty("--editor-h", State.settings.ui.editorH + "%");
    }
    scheduleSave();
  }

  /* ---- current request plumbing ---- */

  function currentRequest() {
    return State.current ? State.current.request : null;
  }

  /** Mutate the current request, mark dirty, refresh dependent UI. */
  function mutateCurrent(fn, options = {}) {
    const request = currentRequest();
    if (!request) return;
    fn(request);
    State.current.dirty = true;
    if (!options.skipUrlRefresh) refreshCommandRow();
    refreshHeader();
    refreshTabs();
    saveBtn.disabled = false;
  }

  function refreshHeader() {
    const crumb = $("#breadcrumb");
    crumb.textContent = "";
    if (!State.current) return;
    crumb.append(icon("home"));
    const collection = State.current.collectionId
      ? State.collections.find((c) => c.id === State.current.collectionId) : null;
    const folder = State.current.folderId && collection
      ? findItem(State.current.folderId) : null;
    if (collection) {
      crumb.append(el("span", { class: "crumb-dim", text: collection.name }));
      crumb.append(el("span", { class: "crumb-dim", text: "/" }));
    }
    if (folder && folder.item) {
      crumb.append(el("span", { class: "crumb-dim", text: folder.item.name }));
      crumb.append(el("span", { class: "crumb-dim", text: "/" }));
    }
    crumb.append(el("span", { class: "crumb-name", text: State.current.request.name || I18N.t("draftName") }));
    if (State.current.dirty) {
      crumb.append(el("span", { class: "dirty-mark", text: "*", "aria-label": "Unsaved changes", title: I18N.t("unsavedTitle") }));
    }
    crumb.append(el("button", {
      class: "icon-btn crumb-rename", type: "button",
      "aria-label": I18N.t("rename"), title: I18N.t("rename"),
      onclick: () => renameCurrent(),
    }, icon("pencil")));
  }

  async function renameCurrent() {
    if (!State.current) return;
    const name = await promptDialog({
      title: I18N.t("rename"),
      label: I18N.t("requestName"),
      value: State.current.request.name || I18N.t("draftName"),
      okText: I18N.t("rename"),
    });
    if (!name) return;
    mutateCurrent((request) => { request.name = name; });
    scheduleSave();
    Sidebar.refresh();
  }

  function refreshCommandRow() {
    const request = currentRequest();
    if (!request) return;
    if (document.activeElement !== urlInput) {
      urlInput.value = request.url;
    }
    renderUrlMirror();
    methodSelect.value = request.method;
    methodSelect.className = "select method-select method-select--" + request.method;
    const tlsOff = request.settings && request.settings.verifyTls === false;
    let badge = $("#tls-badge");
    if (tlsOff) {
      if (!badge) {
        badge = el("span", { class: "badge badge--warn", id: "tls-badge", text: "TLS" });
        $("#method-select").before(badge);
      }
      badge.hidden = false;
    } else if (badge) {
      badge.hidden = true;
    }
  }

  function refreshEnvSelector() {
    const select = $("#env-select");
    select.textContent = "";
    select.append(el("option", { value: "", text: I18N.t("noEnvironment") }));
    for (const env of State.environments) {
      select.append(el("option", { value: env.id, text: env.name }));
    }
    select.value = State.settings.selectedEnvId || "";
    const env = selectedEnvironment();
    const badge = $("#env-prod-badge");
    badge.hidden = !(env && env.prodLike);
    ResponseView.render();
  }

  function refreshTabs() {
    const request = currentRequest();
    const tabbar = $("#editor-tabs");
    tabbar.textContent = "";
    if (!request) return;
    const counts = {
      params: (request.query || []).filter((r) => r.enabled).length,
      headers: (request.headers || []).filter((r) => r.enabled).length,
    };
    for (const tab of TABS) {
      const button = el("button", {
        class: "tab", role: "tab",
        "aria-selected": String(State.activeTab === tab.id),
        onclick: () => { State.activeTab = tab.id; renderTabs(); renderPanel(); },
      },
        el("span", { text: I18N.t(tab.label) }),
      );
      if (counts[tab.id]) button.append(el("span", { class: "tab__count", text: String(counts[tab.id]) }));
      tabbar.append(button);
    }
  }

  function renderTabs() {
    refreshTabs();
    renderPanel();
  }

  /* ---- panels ---- */

  function renderPanel() {
    const panel = $("#editor-panel");
    panel.textContent = "";
    const request = currentRequest();
    if (!request) return;
    if (State.activeTab === "params") renderParamsPanel(panel, request);
    else if (State.activeTab === "headers") renderHeadersPanel(panel, request);
    else if (State.activeTab === "auth") renderAuthPanel(panel, request);
    else if (State.activeTab === "body") renderBodyPanel(panel, request);
    else if (State.activeTab === "settings") renderSettingsPanel(panel, request);
  }

  const rerenderAllRows = () => renderPanel();

  function renderParamsPanel(panel, request) {
    if (!request.query.length) request.query.push(newRow());
    const box = el("div", { class: "panel-stack" });
    renderKvEditor(box, request.query, {
      addLabel: "addParam",
      rerenderAll: rerenderAllRows,
      onchange: () => {
        syncUrlFromQuery(request);
        mutateCurrent(() => {}, { skipUrlRefresh: true });
      },
    });
    panel.append(box);
  }

  function renderHeadersPanel(panel, request) {
    if (!request.headers.length) request.headers.push(newRow());
    const box = el("div", { class: "panel-stack" });
    renderKvEditor(box, request.headers, {
      addLabel: "addHeader",
      rerenderAll: rerenderAllRows,
      onchange: () => mutateCurrent(() => {}, { skipUrlRefresh: true }),
    });
    panel.append(box);
  }

  const AUTH_TYPES = [
    { id: "none", label: "authNone", desc: "authNoneDesc", icon: "slash" },
    { id: "apikey", label: "authApiKey", desc: "authApiKeyDesc", icon: "keyIcon" },
    { id: "bearer", label: "authBearer", desc: "authBearerDesc", icon: "shield" },
    { id: "basic", label: "authBasic", desc: "authBasicDesc", icon: "user" },
  ];

  function renderAuthPanel(panel, request) {
    const auth = request.auth;
    const rail = el("div", { class: "auth-rail", role: "tablist", "aria-label": I18N.t("authType") });
    const detail = el("div", { class: "auth-detail" });

    const renderDetail = () => {
      detail.textContent = "";
      const meta = AUTH_TYPES.find((t) => t.id === auth.type) || AUTH_TYPES[0];
      detail.append(
        el("h3", { class: "auth-detail__title", text: I18N.t(meta.label) }),
        el("p", { class: "auth-detail__desc", text: I18N.t(meta.desc) }),
      );

      const field = (labelKey, key, secret) => {
        const input = el("input", {
          class: "input mono", type: secret && !auth.reveal ? "password" : "text",
          value: auth[key] || "", spellcheck: "false",
          "aria-label": I18N.t(labelKey),
        });
        input.addEventListener("input", () => {
          mutateCurrent((req) => { req.auth[key] = input.value; });
        });
        detail.append(el("div", { class: "auth-detail__field" },
          el("label", { text: I18N.t(labelKey) }),
          el("div", { class: "secret-wrap", style: "display:flex" },
            input,
            secret
              ? el("button", {
                  class: "icon-btn", type: "button", style: "width:28px",
                  "aria-label": auth.reveal ? "Hide value" : "Reveal value",
                  onclick: () => {
                    auth.reveal = !auth.reveal;
                    renderDetail();
                  },
                }, icon(auth.reveal ? "eyeOff" : "eye"))
              : null,
          ),
        ));
      };

      if (auth.type === "bearer") field("tokenLabel", "token", true);
      if (auth.type === "basic") {
        field("usernameLabel", "username", false);
        field("passwordLabel", "password", true);
      }
      if (auth.type === "apikey") {
        field("apiKeyNameLabel", "keyName", false);
        field("apiKeyValueLabel", "keyValue", true);
        const inSelect = el("select", { class: "select", "aria-label": I18N.t("authIn") });
        for (const [value, label] of [["header", "authHeader"], ["query", "authQuery"]]) {
          const option = el("option", { value, text: I18N.t(label) });
          if ((auth.in || "header") === value) option.selected = true;
          inSelect.append(option);
        }
        inSelect.addEventListener("change", () => {
          mutateCurrent((req) => { req.auth.in = inSelect.value; });
        });
        detail.append(el("div", { class: "auth-detail__field" },
          el("label", { text: I18N.t("authIn") }), inSelect));
      }

      if (auth.type !== "none") {
        detail.append(
          el("div", { class: "auth-hint" },
            icon("info"),
            el("span", { text: I18N.t("authHint") }),
            el("button", {
              class: "link-btn", type: "button", text: I18N.t("goToEnvSettings"),
              onclick: openEnvironmentManager,
            }),
          ),
          el("p", { class: "hint auth-session-note", text: I18N.t("authSessionNote") }),
        );
      }
    };

    for (const type of AUTH_TYPES) {
      const selected = auth.type === type.id;
      rail.append(el("button", {
        class: "auth-rail__item",
        role: "tab",
        "aria-selected": String(selected),
        onclick: () => {
          if (auth.type === type.id) return;
          mutateCurrent((req) => { req.auth.type = type.id; });
          renderPanel();
        },
      },
        icon(type.icon),
        el("span", { text: I18N.t(type.label) }),
      ));
    }

    renderDetail();
    panel.append(el("div", { class: "auth-layout" }, rail, detail));
  }

  let bodyGutter, bodyArea;

  function renderBodyPanel(panel, request) {
    const typeSelect = el("select", { class: "select", "aria-label": I18N.t("bodyType") });
    for (const [value, label] of [["none", "bodyNone"], ["json", "bodyJson"], ["text", "bodyText"], ["urlencoded", "bodyForm"]]) {
      const option = el("option", { value, text: I18N.t(label) });
      if ((request.body.type || "none") === value) option.selected = true;
      typeSelect.append(option);
    }
    typeSelect.addEventListener("change", () => {
      mutateCurrent((req) => {
        req.body.type = typeSelect.value;
        if (typeSelect.value === "urlencoded" && !req.body.rows) req.body.rows = [];
      });
      renderPanel();
    });

    const toolbar = el("div", { class: "body-toolbar" },
      el("label", { class: "hint", text: I18N.t("bodyType") }),
      typeSelect,
      el("span", { class: "spacer" }),
    );

    if (request.body.type === "none") {
      panel.append(toolbar);
      return;
    }

    if (State.current && State.current.bodyRedacted) {
      panel.append(el("div", { class: "truncate-note", role: "status" },
        icon("info"),
        el("span", { text: I18N.t("bodyNotRestored") }),
      ));
      State.current.bodyRedacted = false;
    }

    if (request.body.type === "urlencoded") {
      panel.append(toolbar);
      if (!request.body.rows) request.body.rows = [];
      if (!request.body.rows.length) request.body.rows.push(newRow());
      const box = el("div", { class: "panel-stack" });
      renderKvEditor(box, request.body.rows, {
        addLabel: "addParam",
        rerenderAll: rerenderAllRows,
        onchange: () => {
          mutateCurrent((req) => {
            req.body.text = request.body.rows
              .filter((r) => r.enabled && r.key)
              .map((r) => encodeURIComponent(r.key) + "=" + encodeURIComponent(r.value))
              .join("&");
          }, { skipUrlRefresh: true });
        },
      });
      panel.append(box);
      return;
    }

    if (request.body.type === "json") {
      const formatBtn = el("button", { class: "btn btn--sm", text: I18N.t("format"), onclick: () => formatBody(true) });
      const minifyBtn = el("button", { class: "btn btn--sm", text: I18N.t("minify"), onclick: () => formatBody(false) });
      toolbar.append(formatBtn, minifyBtn);
    }

    bodyGutter = el("div", { class: "body-gutter", "aria-hidden": "true" });
    bodyArea = el("textarea", {
      class: "body-textarea",
      spellcheck: "false",
      "aria-label": I18N.t("tabBody"),
      placeholder: request.body.type === "json" ? '{ "key": "value" }' : "",
    });
    bodyArea.value = request.body.text || "";
    bodyArea.addEventListener("input", () => {
      mutateCurrent((req) => { req.body.text = bodyArea.value; });
      updateGutter();
      if (request.body.type === "json") updateJsonStatus(request.body.text);
    });
    bodyArea.addEventListener("scroll", () => {
      bodyGutter.scrollTop = bodyArea.scrollTop;
    });
    bodyArea.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();
        const start = bodyArea.selectionStart;
        bodyArea.setRangeText("  ", start, bodyArea.selectionEnd, "end");
        mutateCurrent((req) => { req.body.text = bodyArea.value; });
      }
    });

    const wrap = el("div", { class: "body-editor-wrap" },
      el("div", { class: "body-editor" }, bodyGutter, bodyArea),
    );
    panel.append(toolbar, wrap);
    const status = el("div", { class: "field-error", id: "json-status", role: "status", hidden: request.body.type !== "json" });
    panel.append(status);
    updateGutter();
    if (request.body.type === "json") updateJsonStatus(request.body.text);
  }

  function updateGutter() {
    if (!bodyGutter || !bodyArea) return;
    const lines = bodyArea.value.split("\n").length;
    bodyGutter.textContent = "";
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= lines; i++) {
      frag.append(document.createTextNode(i + "\n"));
    }
    bodyGutter.append(frag);
    bodyGutter.scrollTop = bodyArea.scrollTop;
  }

  function updateJsonStatus(text) {
    const status = $("#json-status");
    if (!status) return;
    status.hidden = false;
    const trimmed = (text || "").trim();
    if (!trimmed) {
      status.replaceChildren();
      status.hidden = true;
      return;
    }
    try {
      JSON.parse(trimmed);
      status.classList.remove("field-error");
      status.replaceChildren(icon("check"), el("span", { text: I18N.t("jsonValid") }));
    } catch (error) {
      status.classList.add("field-error");
      status.replaceChildren(
        icon("alert"),
        el("span", { text: I18N.t("jsonInvalid") + " — " + error.message }),
      );
    }
  }

  function formatBody(pretty) {
    const request = currentRequest();
    if (!request || request.body.type !== "json") return;
    try {
      const parsed = JSON.parse(request.body.text || "");
      const text = pretty ? JSON.stringify(parsed, null, 2) : JSON.stringify(parsed);
      request.body.text = text;
      State.current.dirty = true;
      renderPanel();
    } catch {
      announce(I18N.t("jsonInvalid"));
    }
  }

  function renderSettingsPanel(panel, request) {
    const settings = request.settings;
    const grid = el("div", { class: "settings-grid" });

    const numberField = (labelKey, key, min, max) => {
      const input = el("input", { class: "input", type: "number", value: settings[key], min, max, "aria-label": I18N.t(labelKey) });
      input.addEventListener("change", () => {
        mutateCurrent((req) => { req.settings[key] = clampInt(input.value, min, max, settings[key]); input.value = req.settings[key]; });
      });
      grid.append(el("label", { class: "hint", text: I18N.t(labelKey) }), input);
    };
    const boolField = (labelKey, key, onChange) => {
      const box = el("input", { type: "checkbox" });
      box.checked = settings[key] !== false;
      box.addEventListener("change", () => {
        mutateCurrent((req) => { req.settings[key] = box.checked; });
        if (onChange) onChange();
      });
      grid.append(el("span"), el("label", { class: "checkbox" }, box, el("span", { text: I18N.t(labelKey) })));
    };

    numberField("timeout", "timeoutMs", 1000, 300000);
    boolField("followRedirects", "followRedirects");
    numberField("maxRedirects", "maxRedirects", 0, 20);
    boolField("verifyTls", "verifyTls", () => {
      refreshCommandRow();
      const warning = panel.querySelector(".tls-warning");
      if (warning) warning.hidden = settings.verifyTls !== false;
    });

    panel.append(grid);

    const warning = el("div", {
      class: "tls-warning truncate-note", role: "alert",
      hidden: settings.verifyTls !== false,
      text: "⚠ " + I18N.t("tlsWarning"),
    });
    panel.append(warning);
  }

  /* ---- URL ↔ params sync ---- */

  function syncQueryFromUrl(request) {
    if (syncingQuery) return;
    syncingQuery = true;
    const { pairs } = parseUrlQuery(request.url);
    const disabledRows = request.query.filter((row) => !row.enabled);
    request.query = pairs.map((pair) => newRow(pair.key, pair.value)).concat(disabledRows);
    syncingQuery = false;
    if (State.activeTab === "params") renderPanel();
    refreshTabs();
  }

  function syncUrlFromQuery(request) {
    if (syncingQuery) return;
    syncingQuery = true;
    request.url = rebuildUrlQuery(request.url, serializeQueryPairs(request.query));
    syncingQuery = false;
    refreshCommandRow();
  }

  /* ---- actions ---- */

  function openRequestMenu(event) {
    openContextMenu(event.currentTarget, [
      { label: I18N.t("copyAsCurl"), action: () => RequestFlow.copyCurl() },
      { sep: true },
      { label: I18N.t("save"), action: () => saveCurrent() },
    ]);
  }

  async function saveCurrent() {
    const current = State.current;
    if (!current) return;
    const item = findItem(current.requestId);
    if (item && item.item) {
      item.item.request = deepClone(current.request);
      item.item.name = current.request.name || item.item.name;
    } else {
      // Draft: attach to the target (or first) collection.
      let collection = State.collections.find((c) => c.id === current.collectionId)
        || State.collections[0];
      if (!collection) {
        collection = newCollection("My Collection");
        State.collections.push(collection);
      }
      let parentItems = collection.items;
      if (current.folderId) {
        const folder = findItem(current.folderId);
        if (folder && folder.item && folder.item.type === "folder") parentItems = folder.item.items;
      }
      const newItem = {
        id: current.requestId,
        type: "request",
        name: current.request.name || I18N.t("draftName"),
        request: deepClone(current.request),
      };
      parentItems.push(newItem);
      current.collectionId = collection.id;
    }
    current.dirty = false;
    current.request.name = current.request.name || I18N.t("draftName");
    saveBtn.disabled = true;
    scheduleSave();
    Sidebar.refresh();
    refreshHeader();
    announce(I18N.t("announceSaved"), true);
  }

  /** Ask what to do about unsaved changes. Returns 'save' | 'discard' | 'cancel'. */
  async function guardUnsaved() {
    if (!State.current || !State.current.dirty) return "discard";
    return unsavedDialog();
  }

  function newRequest(location) {
    const id = uuid("req");
    const request = defaultRequest();
    request.name = I18N.t("draftName");
    State.current = {
      requestId: id,
      request,
      collectionId: (location && location.collectionId) || null,
      folderId: (location && location.folderId) || null,
      dirty: true,
      isNew: true,
    };
    State.lastOutcome = null;
    State.activeTab = "params";
    renderAll();
    urlInput.focus();
  }

  async function openRequest(itemId) {
    if (State.current && State.current.requestId === itemId) return;
    const guard = await guardUnsaved();
    if (guard === "cancel") return;
    if (guard === "save") await saveCurrent();
    const found = findItem(itemId);
    if (!found || found.item.type !== "request") return;
    const collection = findCollectionOf(itemId);
    const folder = found.parent && found.parent.type === "folder" ? found.parent : null;
    State.current = {
      requestId: itemId,
      request: deepClone(found.item.request),
      collectionId: collection ? collection.id : null,
      folderId: folder ? folder.id : null,
      dirty: false,
      isNew: false,
    };
    State.lastOutcome = null;
    renderAll();
  }

  async function restoreHistoryEntry(entry) {
    const guard = await guardUnsaved();
    if (guard === "cancel") return;
    if (guard === "save") await saveCurrent();
    const request = deepClone(entry.request);
    request.name = entry.name || request.name || entry.url;
    // Body text is never persisted in history (PRD §6.4); tell the user rather
    // than silently presenting a request with an empty body.
    const bodyRedacted = !!(request.body && request.body.redacted);
    if (bodyRedacted) {
      request.body = { type: request.body.type || "none", text: "" };
    }
    State.current = {
      requestId: uuid("req"),
      request,
      collectionId: null,
      folderId: null,
      dirty: true,
      isNew: true,
      bodyRedacted,
    };
    State.lastOutcome = null;
    renderAll();
    announce(
      bodyRedacted
        ? I18N.t("restoredFromHistory") + ". " + I18N.t("bodyNotRestored")
        : I18N.t("restoredFromHistory"),
      true,
    );
    if (bodyRedacted) toast(I18N.t("bodyNotRestored"));
  }

  /** Collection/folder containing the open request was deleted. */
  function markLocationDeleted() {
    if (!State.current) return;
    State.current.collectionId = null;
    State.current.folderId = null;
    State.current.isNew = true;
    State.current.dirty = true;
    refreshHeader();
    saveBtn.disabled = false;
  }

  function renderAll() {
    Sidebar.refresh();
    refreshHeader();
    refreshCommandRow();
    refreshEnvSelector();
    refreshTabs();
    renderPanel();
    saveBtn.disabled = !(State.current && State.current.dirty);
    ResponseView.render();
  }

  return {
    init,
    renderAll,
    renderPanel,
    refreshHeader,
    refreshEnvSelector,
    refreshTabs,
    refreshActionButtons,
    mutateCurrent,
    currentRequest,
    saveCurrent,
    guardUnsaved,
    newRequest,
    openRequest,
    restoreHistoryEntry,
    markLocationDeleted,
    formatBody,
    get urlInput() { return urlInput; },
  };
})();


/* ==== js/50-response.js ==== */

/* ==== Send/cancel flow and the response inspector ==== */

const RequestFlow = {
  async sendOrCancel() {
    if (State.sending) {
      await Api.cancel(State.sending).catch(() => {});
      return;
    }
    this.send();
  },

  async send() {
    const current = State.current;
    if (!current || State.sending) return;
    const request = current.request;
    const scope = variableScope(request);

    const { spec, issues } = buildSendSpec(request, uuid("call"), scope, false);
    if (!this.validateOrReport(issues)) return;

    const env = selectedEnvironment();
    if (env && env.prodLike && env.confirmUnsafe !== false && UNSAFE_METHODS.includes(request.method)) {
      const ok = await confirmDialog({
        title: I18N.t("prodBadge") + " · " + env.name,
        message: I18N.t("confirmSendUnsafe", { env: env.name, method: request.method }),
        okText: I18N.t("sendAnyway"),
        okClass: "btn--danger",
      });
      if (!ok) return;
    }

    const callId = spec.requestId;
    State.sending = callId;
    State.lastOutcome = null;
    ResponseView.render();

    const timeoutMs = (spec.settings.timeoutMs || 30000) + 5000;
    let outcome;
    try {
      const result = await Api.request(spec, timeoutMs);
      if (State.sending !== callId) return; // superseded
      if (result && result.cancelled) {
        outcome = { kind: "cancelled" };
      } else {
        const response = normalizeResponse(result);
        State.responses.set(current.requestId, response);
        outcome = { kind: "response", response };
      }
    } catch (error) {
      if (State.sending !== callId) return;
      const category = (error && error.data && error.data.category) || "INTERNAL_ERROR";
      if (category === "REQUEST_CANCELLED") {
        outcome = { kind: "cancelled" };
      } else {
        outcome = { kind: "error", category, cause: (error && error.message) || String(error) };
      }
    } finally {
      if (State.sending === callId) State.sending = null;
    }

    State.lastOutcome = outcome.kind === "response" ? null : outcome;
    this.recordHistory(request, outcome);
    ResponseView.render();
    if (outcome.kind === "response") {
      announce(I18N.t("announceSent", { status: outcome.response.status }));
    } else if (outcome.kind === "cancelled") {
      announce(I18N.t("announceCancelled"));
    } else {
      announce(I18N.t("announceFailed", { category: outcome.category }));
    }
  },

  validateOrReport(issues) {
    const fields = Object.keys(issues);
    if (!fields.length) return true;
    const labels = {
      url: I18N.t("urlLabel"),
      headers: I18N.t("tabHeaders"),
      auth: I18N.t("tabAuth"),
      body: I18N.t("tabBody"),
    };
    const lines = fields.map((field) => {
      const issue = issues[field];
      const parts = [labels[field] || field];
      if (issue.invalid) parts.push(I18N.t("invalidUrl"));
      if (issue.json) parts.push(I18N.t("jsonInvalid"));
      if (issue.unresolved && issue.unresolved.length) {
        parts.push(I18N.t("unresolvedVars", { vars: issue.unresolved.join(", ") }));
      }
      return parts.join(" — ");
    });
    const panel = $("#editor-panel");
    let box = panel.querySelector(".field-error[data-send-errors]");
    if (!box) {
      box = el("div", { class: "field-error", "data-send-errors": "1", role: "alert" });
      panel.prepend(box);
    }
    box.textContent = lines.join(" · ");
    box.scrollIntoView({ block: "nearest" });
    announce(I18N.t("notSentYet") + " " + lines.join(". "));
    setTimeout(() => { box.remove(); }, 6000);
    return false;
  },

  /** History snapshot: built from the redacted request copy, so no credential —
   * typed literal or resolved — and no body text can reach persistence. */
  recordHistory(request, outcome) {
    const safe = redactRequestForHistory(request);
    const entry = {
      id: uuid("h"),
      timestamp: Date.now(),
      name: safe.name || "",
      method: safe.method,
      url: safe.url,
      status: outcome.kind === "response" ? outcome.response.status : null,
      durationMs: outcome.kind === "response" ? outcome.response.timing.totalMs : null,
      sizeBytes: outcome.kind === "response" ? outcome.response.body.sizeBytes : null,
      error: outcome.kind === "error" ? { category: outcome.category } : null,
      request: {
        version: 1,
        name: safe.name || "",
        method: safe.method,
        url: safe.url,
        query: [],
        headers: safe.headers
          .filter((row) => row.enabled)
          .map((row) => ({ name: row.key, value: row.value })),
        auth: { type: (safe.auth && safe.auth.type) || "none" },
        body: safe.body,
        variables: safe.variables,
      },
      responseMeta: outcome.kind === "response"
        ? { contentType: outcome.response.contentType, statusText: outcome.response.statusText }
        : null,
    };
    State.history.push(entry);
    if (State.history.length > 500) State.history.splice(0, State.history.length - 500);
    Api.historyAppend(deepClone(entry)).catch(() => {});
    Sidebar.render();
  },

  async copyCurl() {
    const request = State.current && State.current.request;
    if (!request) return;
    const scope = variableScope(request);
    const { spec } = buildSendSpec(request, "curl", scope, true);
    try {
      const result = await Api.exportCurl(spec, 10000);
      const ok = await copyText(result.curl);
      toast(ok ? I18N.t("copied") : I18N.t("copyFailed"));
    } catch (error) {
      toast(I18N.t("copyFailed") + ": " + (error && error.message));
    }
  },
};

function normalizeResponse(result) {
  const body = result.body || {};
  const timing = result.timing || {};
  return {
    requestId: result.requestId,
    status: result.status,
    statusText: result.statusText || "",
    headers: result.headers || [],
    contentType: result.contentType || null,
    body: {
      text: body.text != null ? body.text : null,
      base64: body.base64 != null ? body.base64 : null,
      truncated: !!body.truncated,
      sizeBytes: body.sizeBytes || 0,
    },
    finalUrl: result.finalUrl,
    redirectCount: result.redirectCount || 0,
    timing: {
      totalMs: timing.totalMs != null ? timing.totalMs : null,
      ttfbMs: timing.ttfbMs != null ? timing.ttfbMs : null,
      downloadMs: timing.downloadMs != null ? timing.downloadMs : null,
    },
    timestamp: Date.now(),
  };
}

/* ---- inspector view: content tabs + persistent diagnostics panel ---- */

const ResponseView = {

    State.settings.ui.responseView = State.settings.ui.responseView || "text";

    const tabsBar = $("#response-tabs");

    content.textContent = "";

const PRETTY_HIGHLIGHT_LIMIT = 512 * 1024;

/** Pretty-printed view with a line-number gutter; JSON is syntax-colored
 * unless the payload is too large to highlight within the render budget. */
function renderPrettyJson(text, options) {
  const opts = options || {};
  const highlight = opts.highlight !== false;
  const escaped = escapeHtml(text);
  let codeHtml = null;
  if (highlight && text.length <= PRETTY_HIGHLIGHT_LIMIT) {
    codeHtml = highlightJson(escaped);
  }
  const lines = text.length ? text.split("\n").length : 1;
  const gutter = el("div", { class: "pretty-json__gutter", "aria-hidden": "true" });
  const gutterLines = Array.from({ length: lines }, (_, i) => i + 1).join("\n");
  gutter.textContent = gutterLines;
  const code = el("pre", { class: "pretty-json__code" });
  if (codeHtml !== null) {
    code.innerHTML = codeHtml;
  } else {
    code.textContent = text;
  }
  return el("div", { class: "pretty-json" }, gutter, code);
}

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/** Minimal JSON tokenizer over escaped HTML: keys, strings, numbers, literals. */
function highlightJson(escaped) {
  return escaped.replace(
    /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
    (match, str, colon, literal) => {
      if (str && colon) return '<span class="pj-key">' + str + "</span>" + colon;
      if (str) return '<span class="pj-string">' + str + "</span>";
      if (literal) return '<span class="pj-literal">' + literal + "</span>";
      return '<span class="pj-number">' + match + "</span>";
    },
  );
}

function detectJson(response) {
  const type = (response.contentType || "").toLowerCase();
  if (type.includes("json")) return true;
  const text = response.body.text;
  if (!text) return false;
  const trimmed = text.trim();
  if (!trimmed.startsWith("{") && !trimmed.startsWith("[")) return false;
  try {
    JSON.parse(trimmed);
    return true;
  } catch {
    return false;
  }
}

function openNodeMenu(event, node, response) {
  const { key, path, value } = node;
  const canSetVar = JsonView.canSetAsVariable(value, response.body.truncated);
  openContextMenu(event.target.closest(".jv-row") || event.target, [
    {
      label: I18N.t("copyValue"),
      action: async () => {
        const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
        toast((await copyText(text)) ? I18N.t("copied") : I18N.t("copyFailed"));
      },
    },
    {
      label: I18N.t("copyKey"),
      disabled: key == null,
      action: async () => toast((await copyText(String(key))) ? I18N.t("copied") : I18N.t("copyFailed")),
    },
    {
      label: I18N.t("copyPath"),
      action: async () => toast((await copyText(path)) ? I18N.t("copied") : I18N.t("copyFailed")),
    },
    { sep: true },
    {
      label: I18N.t("setEnvVar"),
      disabled: !canSetVar,
      title: canSetVar ? undefined : I18N.t("setEnvVarDisabled"),
      action: () => setResponseValueAsEnv(key, value),
    },
  ]);
}

async function setResponseValueAsEnv(key, value) {
  let env = selectedEnvironment();
  if (!env) {
    if (!State.environments.length) {
      env = newEnvironment();
      State.environments.push(env);
    } else {
      env = State.environments[0];
    }
    State.settings.selectedEnvId = env.id;
    Editor.refreshEnvSelector();
  }
  const name = String(key == null ? "value" : key).replace(/\s+/g, "_");
  const existing = env.variables.find((v) => v.name === name);
  const serialized = typeof value === "string" ? value : JSON.stringify(value);
  if (existing) {
    existing.value = serialized;
    existing.secret = false;
  } else {
    env.variables.push({ name, value: serialized, secret: false });
  }
  scheduleSave();
  toast(I18N.t("envVarSet", { name, env: env.name }));
}

/** Localized recovery hint per stable error category. */
const NEXT_STEP_KEYS = {
  INVALID_URL: "nextInvalidUrl",
  INVALID_REQUEST: "nextInvalidRequest",
  VARIABLE_UNRESOLVED: "nextVariableUnresolved",
  DNS_FAILED: "nextDnsFailed",
  CONNECT_FAILED: "nextConnectFailed",
  TLS_FAILED: "nextTlsFailed",
  TIMEOUT: "nextTimeout",
  REQUEST_CANCELLED: "nextRequestCancelled",
  TOO_MANY_REDIRECTS: "nextTooManyRedirects",
  BODY_TOO_LARGE: "nextBodyTooLarge",
  INTERNAL_ERROR: "nextInternalError",
};

function nextStepFor(category) {
  const key = NEXT_STEP_KEYS[category];
  return key ? I18N.t(key) : I18N.t("nextInternalError");
}

/* ==== Global keyboard shortcuts ====
   Send Ctrl/Cmd+Enter · Save Ctrl/Cmd+S · New Request Ctrl/Cmd+N ·
   focus URL Ctrl/Cmd+L · format JSON Shift+Alt+F */

function initShortcuts() {
  document.addEventListener("keydown", (event) => {
    const mod = event.ctrlKey || event.metaKey;
    if (mod && event.key === "Enter") {
      event.preventDefault();
      RequestFlow.sendOrCancel();
      return;
    }
    if (mod && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "s") {
      event.preventDefault();
      Editor.saveCurrent();
      return;
    }
    if (mod && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "n") {
      event.preventDefault();
      Editor.newRequest();
      return;
    }
    if (mod && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "l") {
      event.preventDefault();
      Editor.urlInput.focus();
      Editor.urlInput.select();
      return;
    }
    if (event.shiftKey && event.altKey && event.key.toLowerCase() === "f") {
      event.preventDefault();
      Editor.formatBody(true);
    }
  });
}

/* ==== Bootstrap ==== */

async function bootstrap() {
  await window.dbxPlugin.ready;

  applyEnvironment();
  applyI18nText();

  window.addEventListener("dbx-plugin-env", () => {
    applyEnvironment();
    applyI18nText();
    Editor.refreshActionButtons();
    Editor.refreshEnvSelector();
    Editor.refreshTabs();
    Editor.renderPanel();
    ResponseView.render();
    Sidebar.render();
  });

  const loaded = await Api.loadAll().catch(() => ({ state: null, history: [] }));
  if (loaded.state) hydrateState(loaded.state);
  State.history = loaded.history || [];
  seedIfEmpty();

  Sidebar.init();
  Editor.init();
  ResponseView.init();
  initShortcuts();

  Editor.newRequest();
  $("#boot").remove();
  $("#app").hidden = false;
}

function applyEnvironment() {
  I18N.setLocale(window.dbxPlugin.locale || "en");
  const theme = window.dbxPlugin.theme || {};
  const appearance = theme.appearance || "light";
  document.body.dataset.fallback = appearance === "dark" ? "dark" : "light";
  document.documentElement.style.colorScheme = appearance;
}

function applyI18nText() {
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    node.textContent = I18N.t(node.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach((node) => {
    node.setAttribute("aria-label", I18N.t(node.dataset.i18nAria));
    node.title = I18N.t(node.dataset.i18nAria);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((node) => {
    node.placeholder = I18N.t(node.dataset.i18nPh);
  });
}

function hydrateState(saved) {
  if (!saved || typeof saved !== "object") return;
  if (Array.isArray(saved.collections)) State.collections = saved.collections;
  if (Array.isArray(saved.environments)) {
    // Loaded state carries no secret values by design; mark them present-but-empty.
    State.environments = saved.environments.map((env) => ({
      ...env,
      variables: (env.variables || []).map((v) => ({
        name: v.name || "",
        value: v.secret ? "" : (v.value || ""),
        secret: !!v.secret,
      })),
    }));
  }
  if (saved.settings && typeof saved.settings === "object") {
    State.settings = {
      ...State.settings,
      ...saved.settings,
      ui: { ...State.settings.ui, ...(saved.settings.ui || {}) },
    };
  }
}

function seedIfEmpty() {
  if (!State.collections.length) {
    const collection = newCollection("My Collection");
    const folder = { id: uuid("fld"), type: "folder", name: "Examples", items: [] };
    const sample = newRequestItem("Sample GET");
    sample.request.url = "https://httpbin.org/get";
    sample.request.headers.push(newRow("Accept", "application/json"));
    folder.items.push(sample);
    collection.items.push(folder);
    State.collections.push(collection);
  }
}

bootstrap().catch((error) => {
  const boot = document.getElementById("boot");
  if (boot) {
    boot.textContent = "API Studio failed to start: " + (error && error.message ? error.message : error);
  }
});

})();
</script>
</body>
</html>
