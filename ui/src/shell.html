<div class="app" id="app" hidden>
  <nav class="sidebar" id="sidebar" aria-label="API Studio">
    <div class="sidebar-header">
      <svg class="sidebar-header__logo" viewBox="0 0 36 36" aria-hidden="true">
        <defs>
          <linearGradient id="api-logo-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6" />
            <stop offset="1" stop-color="#10b981" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="34" height="34" rx="9" fill="url(#api-logo-grad)" />
        <g stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M12 13l12 5M12.5 24.5l11.5-6" />
        </g>
        <g fill="#fff">
          <circle cx="10.2" cy="11.8" r="2.6" />
          <circle cx="26" cy="18" r="2.6" />
          <circle cx="10.8" cy="25.4" r="2.6" />
        </g>
      </svg>
      <div class="sidebar-header__text">
        <div class="sidebar-header__title">API Studio</div>
        <div class="sidebar-header__subtitle" data-i18n="appSubtitle"></div>
      </div>
      <span class="sidebar-header__spacer"></span>
      <button class="icon-btn" id="btn-sidebar-collapse" data-i18n-aria="collapseSidebar"></button>
    </div>
    <div class="sidebar__actions">
      <button class="btn" id="btn-new-request" data-i18n="newRequest"></button>
      <button class="btn" id="btn-new-collection" data-i18n="newCollection"></button>
    </div>
    <div class="sidebar__search">
      <input class="input" id="search-input" data-i18n-ph="searchPlaceholder"
             type="search" role="searchbox" data-i18n-aria="searchPlaceholder" />
    </div>
    <div class="sidebar__body" id="tree-root"></div>
  </nav>

  <div class="splitter splitter--v" id="splitter-sidebar" role="separator"
       aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>

  <div class="main-col">
    <header class="editor-head">
      <button class="icon-btn" id="btn-sidebar-show" data-i18n-aria="showSidebar" hidden></button>
      <div class="editor-head__crumb" id="breadcrumb"></div>
      <div class="editor-head__env">
        <span class="badge badge--prod" id="env-prod-badge" hidden data-i18n="prodBadge"></span>
        <label class="hint" for="env-select" data-i18n="environment"></label>
        <button class="icon-btn" id="btn-env-manager" data-i18n-aria="manageEnvironments"
                aria-haspopup="dialog"></button>
        <select class="select" id="env-select"></select>
      </div>
    </header>

    <section aria-label="Request editor">
      <div class="command-row">
        <select class="select method-select" id="method-select" aria-label="HTTP method"></select>
        <div class="url-wrap" id="url-wrap">
          <div class="url-mirror" id="url-mirror" aria-hidden="true"></div>
          <input class="input url-input mono" id="url-input" type="text" spellcheck="false"
                 aria-label="Request URL" placeholder="https://" autocomplete="off" />
        </div>
        <span class="send-group">
          <button class="btn btn--primary btn--send" id="btn-send"></button>
          <button class="send-caret" id="btn-send-caret" data-i18n-aria="moreActions"
                  aria-haspopup="menu" title="More actions"></button>
        </span>
        <button class="btn btn--save" id="btn-save"></button>
        <button class="icon-btn" id="btn-request-menu" data-i18n-aria="moreActions"
                aria-haspopup="menu"></button>
      </div>
      <div class="tabs" id="editor-tabs" role="tablist" aria-label="Request sections"></div>
      <div class="request-panel" id="editor-panel" role="tabpanel"></div>
    </section>

    <div class="splitter splitter--h" id="splitter-response" role="separator"
         aria-orientation="horizontal" aria-label="Resize response area" tabindex="0"></div>

    <section class="response-area" aria-label="Response">
      <div class="response-tabbar">
        <div class="tabs" id="response-tabs" role="tablist" aria-label="Response"></div>
        <div class="response-summary" id="response-summary"></div>
      </div>
      <div class="response-columns">
        <div class="response-body-wrap" id="response-wrap">
          <div class="response-content" id="response-content"></div>
        </div>
        <aside class="diagnostics-panel" id="diagnostics-panel"
               aria-label="Diagnostics" data-i18n-aria="diagnostics"></aside>
      </div>
    </section>
  </div>
</div>

<div class="boot" id="boot">
  <div class="spinner" role="status" aria-live="polite"></div>
  <span data-i18n="booting">Starting API Studio…</span>
</div>

<div class="toast-region" id="toast-region"></div>
<div class="visually-hidden" id="live-region" role="alert" aria-live="assertive"></div>
<div class="visually-hidden" id="live-region-polite" role="status" aria-live="polite"></div>
