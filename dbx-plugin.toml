schema_version = 1

[backend]
language = "rust"
directory = "backend"
binary = "dbx-plugin-dbx-plugin-api-studio"

[dev]
# `frontend/src` is bundled by Vite and inlined into a single self-contained
# `ui/index.html` (tools/build-ui.mjs). The watcher prints DBX_UI_BUILD_SUCCESS
# on its own line after every successful build so the dev host reloads frames.
ui_build = ["node", "tools/build-ui.mjs"]
ui_watch = ["node", "tools/build-ui.mjs", "--watch"]

[package]
include = ["assets", "ui"]
